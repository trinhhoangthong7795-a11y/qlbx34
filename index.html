<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b2e59">
<title>QLBX34 - Quản Lý Bãi Xe 34</title>
<style>
:root{--blue:#0057b8;--blue2:#1e7bff;--navy:#0b2e59;--blue-bg:#e8f1ff;--ink:#0f1c2e;--mute:#5d6b7e;--line:#d6dfeb;--bg:#f3f6fb;--ok:#12a150;--bad:#d92d20;--warn:#f59e0b;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.4}
button{font-family:inherit;font-size:16px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(30,123,255,.15)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px;color:#26364d}
.req{color:var(--bad)}
#header{position:fixed;top:0;left:0;right:0;height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 8px;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#header .burger{width:48px;height:48px;background:none;border:none;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}
#header .burger span{display:block;width:24px;height:3px;background:#fff;border-radius:2px}
#header .ttl{flex:1;font-weight:800;font-size:18px;padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#header .ttl small{display:block;font-weight:500;font-size:11px;opacity:.85;margin-top:-2px}
.dotwrap{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700;margin-right:4px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.dot.on{background:#3ddc84}
#searchbar{position:fixed;top:56px;left:0;right:0;background:#fff;padding:8px 12px;z-index:40;border-bottom:1px solid var(--line);display:flex;gap:8px}
#searchbar input{padding:11px 14px;border-radius:24px;background:var(--bg)}
#searchbar button{border:none;background:var(--blue-bg);color:var(--blue);font-weight:800;border-radius:24px;padding:0 16px}
#main{padding:122px 12px 40px;max-width:900px;margin:0 auto}
#overlay{position:fixed;inset:0;background:rgba(10,20,40,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
#overlay.show{opacity:1;pointer-events:auto}
#sidebar{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:320px;background:#fff;transform:translateX(-102%);transition:transform .28s cubic-bezier(.3,.8,.3,1);z-index:70;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.25)}
#sidebar.show{transform:translateX(0)}
#sidebar .sh{background:var(--navy);color:#fff;padding:22px 18px}
#sidebar .sh b{font-size:20px;display:block}
#sidebar .sh span{font-size:13px;opacity:.85}
#sidebar nav{flex:1;overflow:auto;padding:8px}
#sidebar nav button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:none;background:none;padding:16px 14px;border-radius:12px;font-size:16px;font-weight:600;color:var(--ink)}
#sidebar nav button.act{background:var(--blue-bg);color:var(--blue)}
#sidebar nav button i{font-style:normal;font-size:22px;width:28px;text-align:center}
.card{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(15,28,46,.08);border:1px solid #e6edf6}
.card h3{margin:0 0 10px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:#fff;border-radius:var(--r);padding:12px 6px;text-align:center;border:1px solid #e6edf6;box-shadow:0 1px 4px rgba(15,28,46,.06)}
.stat b{display:block;font-size:26px;color:var(--blue)}
.stat span{font-size:12px;color:var(--mute);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:14px 16px;font-weight:800;background:var(--blue);color:#fff;min-height:50px}
.btn.sec{background:var(--blue-bg);color:var(--blue)}
.btn.red{background:#fdecea;color:var(--bad)}
.btn.grn{background:#e3f7ec;color:var(--ok)}
.btn.block{width:100%}
.btn:active{transform:scale(.98);opacity:.9}
.row{display:flex;gap:8px}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:9px 14px;font-weight:700;font-size:14px;color:var(--ink)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip.cu{background:#e3eeff;border-color:#8db6f5}
.chip.moi{background:#dff6e6;border-color:#7ed3a1}
.ddw{display:flex;gap:8px}
.ddw select{flex:1}
.plus{flex:0 0 52px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:24px;font-weight:800}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow .btn{flex:0 0 auto;min-height:0;padding:0 18px}
.seg{display:flex;background:#e6edf6;border-radius:12px;padding:4px;gap:4px;margin-top:6px}
.seg button{flex:1;border:none;background:none;padding:12px 6px;border-radius:9px;font-weight:800;color:var(--mute);font-size:15px}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg button.on.m{color:var(--ok)}
.dcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.dcard{background:#fff;border:1.5px solid #d3e0f3;border-radius:16px;padding:14px;text-align:left;box-shadow:0 1px 4px rgba(15,28,46,.08)}
.dcard b{font-size:20px;display:block;color:var(--navy)}
.dcard .sub{font-size:13px;color:var(--mute);font-weight:600;margin-top:2px}
.bar{height:10px;background:#e3eaf4;border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1e7bff,#0057b8);border-radius:6px}
.bar i.hi{background:linear-gradient(90deg,#f59e0b,#d92d20)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--mute);margin:6px 0 10px}
.legend s{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;text-decoration:none}
.colhd{display:grid;grid-template-columns:1fr 1fr 12px 1fr 1fr;gap:5px;position:sticky;top:108px;z-index:5;background:var(--bg);padding:6px 0;text-align:center;font-weight:900;font-size:14px;color:var(--navy)}
.lot{display:grid;grid-template-columns:1fr 1fr 12px 1fr 1fr;gap:5px}
.lot .aisle{background:repeating-linear-gradient(0deg,#cdd8e6 0 6px,transparent 6px 12px);width:3px;margin:0 auto;border-radius:2px}
.cell{min-height:58px;border-radius:10px;border:1.5px dashed #c4d1e2;background:#f7f9fc;padding:3px 2px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;color:var(--ink);width:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cell .sl{font-size:10px;color:#8a98ab;font-weight:700}
.cell .pl{font-size:12px;font-weight:900;letter-spacing:-.2px;word-break:break-all;line-height:1.1}
.cell .md{font-size:10px;font-weight:700;margin-top:2px;line-height:1.1}
.cell.occ{border-style:solid}
.cell.occ.cu{border-color:#1e6fe0;background:#e3eeff}
.cell.occ.cu .sl,.cell.occ.cu .md{color:#1e6fe0}
.cell.occ.moi{border-color:#15a34a;background:#dff6e6}
.cell.occ.moi .sl,.cell.occ.moi .md{color:#15803d}
.cell.free{background:#eefaf2;border:1.5px solid #7ed3a1}
.cell.dis{opacity:.45;pointer-events:none}
.cell.hl{outline:3px solid var(--warn);background:#fff6dd}
.cell.target{outline:3px solid #12a150;background:#d5f5e1}
.cell.pk{min-height:42px}
.ghost{position:fixed;z-index:500;pointer-events:none;background:#fff;border:2px solid var(--blue);border-radius:10px;padding:8px 12px;font-weight:900;box-shadow:0 6px 18px rgba(0,0,0,.3);transform:translate(-50%,-120%)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{flex:1;border:none;background:#e6edf6;padding:12px;border-radius:12px;font-weight:800;color:var(--mute);min-width:56px}
.tabs button.on{background:var(--blue);color:#fff}
.item{background:#fff;border-radius:var(--r);border:1px solid #e6edf6;padding:12px;margin-bottom:10px;display:block;width:100%;text-align:left;box-shadow:0 1px 3px rgba(15,28,46,.06)}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item .plate{font-size:20px;font-weight:900;letter-spacing:.5px}
.badge{display:inline-block;background:var(--blue-bg);color:var(--blue);font-weight:800;font-size:12px;border-radius:8px;padding:3px 8px}
.badge.g{background:#e9edf3;color:#556}
.badge.o{background:#fff1d6;color:#9a5b00}
.badge.m{background:#dff6e6;color:#15803d}
.item .meta{font-size:14px;color:var(--mute);margin-top:4px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.lrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #edf1f6}
.lrow span{flex:1;font-weight:600}
.lrow button{border:none;background:#eef2f7;border-radius:10px;width:42px;height:42px;font-size:18px}
#modal{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:90;display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 28px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
#sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
#sheet .hd h2{margin:0;font-size:20px}
#sheet .x{border:none;background:#eef2f7;width:40px;height:40px;border-radius:50%;font-size:20px;font-weight:800;color:var(--mute)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf1f6;font-size:15px}
.kv span{color:var(--mute);flex:0 0 38%}
.kv b{text-align:right;flex:1;word-break:break-word}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:800;color:var(--blue)}
#loading.show{display:flex}
.spin{width:48px;height:48px;border:5px solid var(--blue-bg);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#16233a;color:#fff;padding:12px 20px;border-radius:24px;font-weight:700;z-index:300;transition:transform .25s;max-width:90%;text-align:center;font-size:15px}
#toast.show{transform:translateX(-50%) translateY(0)}
.hint{font-size:13px;color:var(--mute);margin:6px 0}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px;font-size:14px;font-weight:600}
.chk input{width:22px;height:22px;flex:0 0 22px;margin:0;padding:0}
#prevImg{width:100%;border:1px solid var(--line);border-radius:10px;margin-top:12px}

/* ===== Report dashboard (landscape) ===== */
#reportHost{position:absolute;left:-10000px;top:0;width:1150px}
.rpd{width:1150px;background:#f0f4f9;padding:30px 32px 22px;color:#0f1c2e;font-family:Roboto,-apple-system,"Segoe UI",Arial,sans-serif}
.rpd .hb{background:#0b2e59;color:#fff;border-radius:26px;padding:32px 38px 28px}
.rpd .hb h1{margin:0;font-size:36px;font-weight:700;letter-spacing:.3px}
.rpd .hb p{margin:6px 0 0;font-size:18px;opacity:.88}
.rpd .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px}
.rpd .kp{background:#fff;border-radius:16px;padding:22px 24px 12px;border-top:6px solid #2563eb;height:150px}
.rpd .kp .l{font-size:17px;font-weight:700;color:#475569;letter-spacing:.2px}
.rpd .kp .n{font-size:58px;font-weight:700;margin-top:18px;line-height:1}
.rpd .mid{display:grid;grid-template-columns:65fr 35fr;gap:12px;margin-top:12px}
.rpd .cd{background:#fff;border-radius:18px;padding:28px 30px}
.rpd .cd h2{margin:0;font-size:22px;font-weight:700;color:#0b2e59;text-transform:uppercase}
.rpd .cd .sub{font-size:14px;color:#94a3b8;margin-top:6px}
.rpd .chart{position:relative;height:290px;margin:22px 0 0 44px}
.rpd .gl{position:absolute;left:0;right:0;border-top:2px solid #e5ebf3}
.rpd .gl span{position:absolute;left:-44px;top:-9px;font-size:13px;color:#94a3b8}
.rpd .cols{position:absolute;left:0;right:0;top:0;bottom:0;display:flex}
.rpd .col{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:4px;height:100%}
.rpd .bw{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;width:22px}
.rpd .bv{font-size:13px;font-weight:700;line-height:16px;height:16px}
.rpd .b{width:16px;border-radius:5px 5px 0 0;min-height:0}
.rpd .xl{display:flex;margin:8px 0 0 44px}
.rpd .xl span{flex:1;text-align:center;font-size:14px;color:#64748b}
.rpd .lg{display:flex;gap:26px;margin-top:14px;font-size:15px;color:#475569}
.rpd .lg i{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.rpd .ind{display:flex;justify-content:space-between;align-items:center;padding:30px 4px 18px;border-bottom:2px solid #e5ebf3;font-size:20px;color:#334155}
.rpd .ind:last-child{border-bottom:none}
.rpd .ind b{font-size:36px;font-weight:500;color:#0f1c2e}
.rpd .age{display:grid;grid-template-columns:340px 1fr 70px;align-items:center;gap:0 14px;margin-top:20px;font-size:19px;color:#334155}
.rpd .tr{height:22px;background:#e2e8f0;border-radius:11px;overflow:hidden}
.rpd .tr i{display:block;height:100%;border-radius:11px}
.rpd .age b{text-align:right;font-size:20px;color:#0f1c2e}
.rpd .nb{margin-top:14px;border:2px solid #cbd5e1;border-radius:14px;padding:22px 24px;min-height:96px;font-size:18px;white-space:pre-wrap;color:#1e293b}
.rpd .nb.none{font-style:italic;color:#94a3b8}
.rpd .ft{margin-top:18px;font-size:14px;color:#94a3b8;line-height:1.5}
</style>
</head>

<div id="header">
  <button class="burger" onclick="toggleSidebar(true)" aria-label="Menu"><span></span><span></span><span></span></button>

</div>

<script>
'use strict';
/* ================= CONSTANTS ================= */
var DEF_LISTS={
  dongXe:['VF 3','VF 5','VFe34','VF 6','VF 7','VF 8','VF 9','Limo Green','Minio Green','EC Van'],
  boPhan:['Điều phối','Cố vấn','Kỹ thuật','Kho','PKD'],
  ttVao:['Chờ sửa','Chờ giao','Lưu bãi'],
  ttRa:['Về xưởng','Giao GSM','Giao khách']
};
var LIST_NAMES={dongXe:'Dòng xe',boPhan:'Tên / Bộ phận',ttVao:'Trạng thái khi vào',ttRa:'Trạng thái khi ra'};
var COLS=['T','TLD','PLD','P'];
var ROWS=20;
var LS_DATA='qlbx34_sessions', LS_FB='qlbx34_fbcfg', LS_DEL='qlbx34_deleted', LS_APP='qlbx34_appcfg', LS_REPTXT='qlbx34_rep_text';
var DB_PATH='qlbx34/sessions', CFG_PATH='qlbx34/config';
var DEFAULT_FB={apiKey:'',databaseURL:'https://new-erp-608f6-default-rtdb.firebaseio.com',projectId:'new-erp-608f6'};
var DAY_MS=86400000;

/* ================= STATE ================= */
var sessions=[], tombstones={}, appCfg=null;
var view='overview', listTab='in', searchQ='', openDay=null, unQ='', formType='cu';
var fbRef=null, cfgRef=null, fbConnected=false, fbConfigured=false, remoteKnown={};
var reportBlob=null;
var rep={mode:'tuan',anchor:'',from:'',to:'',sel:{},text:''};

/* ================= UTILS ================= */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function normPlate(v){return String(v==null?'':v).toUpperCase().replace(/[-.\s]/g,'');}
function normVin(v){return String(v==null?'':v).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(-6);}
function stripAcc(s){return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();}
var dfmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',year:'numeric'});
function today(){return dfmt.format(new Date());}
function pad(n){return (n<10?'0':'')+n;}
function validDate(s){
  var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s||''); if(!m)return false;
  var d=+m[1],mo=+m[2],y=+m[3]; if(mo<1||mo>12||d<1||y<2000)return false;
  var dt=new Date(Date.UTC(y,mo-1,d)); return dt.getUTCDate()===d&&dt.getUTCMonth()===mo-1;
}
function dateKey(s){var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s||'');return m?(m[3]+m[2]+m[1]):'';}
function parseD(s){var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s||'');return m?Date.UTC(+m[3],+m[2]-1,+m[1]):NaN;}
function strD(ms){var d=new Date(ms);return pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1)+'/'+d.getUTCFullYear();}
function normDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v)){return pad(v.getDate())+'/'+pad(v.getMonth()+1)+'/'+v.getFullYear();}
  if(typeof v==='number'){var dt=new Date(Math.round((v-25569)*DAY_MS));return pad(dt.getUTCDate())+'/'+pad(dt.getUTCMonth()+1)+'/'+dt.getUTCFullYear();}
  var s=String(v).trim(), m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(s);
  if(m){return pad(+m[1])+'/'+pad(+m[2])+'/'+m[3];}
  m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); if(m)return m[3]+'/'+m[2]+'/'+m[1];
  return '';
}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function toArr(v){if(Array.isArray(v))return v.filter(function(x){return x!=null;});if(v&&typeof v==='object')return Object.keys(v).map(function(k){return v[k];});return [];}
var toastT=null;
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2600);}
function showLoading(t){$('loadtxt').textContent=t||'Đang xử lý...';$('loading').classList.add('show');}
function hideLoading(){$('loading').classList.remove('show');}
function fmtDate(el){
  var v=el.value.replace(/\D/g,'').slice(0,8), o=v;
  if(v.length>4)o=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);
  else if(v.length>2)o=v.slice(0,2)+'/'+v.slice(2);
  el.value=o;
}

/* ================= SLOTS ================= */
var SLOT_RE=/^(\d+)(TLD|PLD|T|P)-(\d+)$/;
function slotId(d,r,c){return d+c+'-'+r;}
function slotLabel(id){var m=SLOT_RE.exec(id||'');return m?('Dãy '+m[1]+' · '+id):'Chưa xếp';}
function slotDay(id){var m=SLOT_RE.exec(id||'');return m?+m[1]:0;}
function parseSlot(v){
  var s=String(v==null?'':v).toUpperCase().replace(/[\s.·:_]/g,'');
  s=s.replace(/^(DÃY|DAY)/,'D');
  var m=SLOT_RE.exec(s);
  if(m&&+m[3]>=1&&+m[3]<=ROWS)return s;
  m=/^D(\d+)-?(\d+)(TLD|PLD|T|P)$/.exec(s); /* định dạng cũ D1-1T */
  if(m&&+m[2]>=1&&+m[2]<=ROWS)return slotId(+m[1],+m[2],m[3]);
  m=/^(\d+)-(\d+)(TLD|PLD|T|P)$/.exec(s);
  if(m&&+m[2]>=1&&+m[2]<=ROWS)return slotId(+m[1],+m[2],m[3]);
  return '';
}
function occMap(){var o={};sessions.forEach(function(s){if(s.status==='in_lot'&&s.viTri)o[s.viTri]=s;});return o;}

/* ================= CONFIG (days + dropdown lists) ================= */
function normCfg(c){
  c=c||{};var L=c.lists||{};
  var out={days:[],lists:{},updatedAt:c.updatedAt||0};
  var seen={};
  toArr(c.days).map(Number).forEach(function(n){if(n>0&&isFinite(n)&&!seen[n]){seen[n]=1;out.days.push(n);}});
  out.days.sort(function(a,b){return a-b;});
  if(!out.days.length)out.days=[1,2,3,4,5];
  Object.keys(DEF_LISTS).forEach(function(k){
    var a=toArr(L[k]).map(function(x){return String(x).trim();}).filter(Boolean);
    out.lists[k]=a.length?a:DEF_LISTS[k].slice();
  });
  return out;
}
function loadAppCfg(){var c=null;try{c=JSON.parse(localStorage.getItem(LS_APP)||'null');}catch(e){}appCfg=normCfg(c);}
function pushCfg(){if(cfgRef){try{cfgRef.set(JSON.parse(JSON.stringify(appCfg))).catch(function(){});}catch(e){}}}
function saveConfig(){
  appCfg.updatedAt=Date.now();
  try{localStorage.setItem(LS_APP,JSON.stringify(appCfg));}catch(e){}
  pushCfg();
}
function onCfgRemote(v){
  if(!v){pushCfg();return;}
  var r=normCfg(v);
  if((r.updatedAt||0)>(appCfg.updatedAt||0)){
    appCfg=r;try{localStorage.setItem(LS_APP,JSON.stringify(appCfg));}catch(e){}
    if(openDay&&appCfg.days.indexOf(openDay)<0)openDay=null;
    render();
  }else if((r.updatedAt||0)<(appCfg.updatedAt||0))pushCfg();
}
function addToList(key,val){
  val=String(val||'').trim();if(!val)return false;
  var l=appCfg.lists[key];
  if(l.some(function(x){return x.toLowerCase()===val.toLowerCase();}))return false;
  l.push(val);return true;
}
function ensureDay(d){
  if(d>0&&appCfg.days.indexOf(d)<0){appCfg.days.push(d);appCfg.days.sort(function(a,b){return a-b;});return true;}
  return false;
}

function loadData(){
  try{var r=localStorage.getItem(LS_DATA);sessions=r?JSON.parse(r):[];if(!Array.isArray(sessions))sessions=[];}catch(e){sessions=[];}
  sessions=sessions.map(normSession);
  try{tombstones=JSON.parse(localStorage.getItem(LS_DEL)||'{}')||{};}catch(e){tombstones={};}
}
function saveLocal(){
  try{localStorage.setItem(LS_DATA,JSON.stringify(sessions));localStorage.setItem(LS_DEL,JSON.stringify(tombstones));}
  catch(e){toast('Không lưu được bộ nhớ máy!');}
}
function clean(s){return JSON.parse(JSON.stringify(s));}
function pushOne(s){if(fbRef){try{fbRef.child(s.id).set(clean(s)).catch(function(){});}catch(e){}}}
function pushAll(){if(!fbRef)return;sessions.forEach(pushOne);}
function upsert(s){
  s.updatedAt=Date.now();
  var i=sessions.findIndex(function(x){return x.id===s.id;});
  if(i>=0)sessions[i]=s;else sessions.push(s);
  saveLocal();pushOne(s);render();
}
function removeSession(id){
  sessions=sessions.filter(function(x){return x.id!==id;});
  tombstones[id]=Date.now();saveLocal();
  if(fbRef){try{fbRef.child(id).remove().catch(function(){});}catch(e){}}
  render();
}
function findS(id){return sessions.find(function(x){return x.id===id;});}
function normSession(o){
  o=o||{};
  var ngayRa=normDate(o.ngayRa!=null?o.ngayRa:(o.ngayXuat!=null?o.ngayXuat:o.exitDate));
  var ttRa=String(o.trangThaiRa!=null?o.trangThaiRa:(o.trangThaiXuat||'')).trim();
  var st=(o.status==='exited'||o.status==='in_lot')?o.status:((ngayRa||ttRa)?'exited':'in_lot');
  var bs=normPlate(o.bienSo!=null?o.bienSo:(o.plate!=null?o.plate:''));
  var vin=normVin(o.vin6!=null?o.vin6:'');
  var lo=String(o.loai||'').toLowerCase();
  var loai=(lo==='moi'||lo==='xe mới'||lo==='xe moi')?'moi':((!bs&&vin)?'moi':'cu');
  return {
    id:o.id?String(o.id):genId(),
    loai:loai,
    bienSo:loai==='moi'?'':bs,
    vin6:loai==='moi'?vin:'',
    mauXe:String(o.mauXe||'').trim(),
    soChia:String(o.soChia||'').trim(),
    dongXe:String(o.dongXe!=null?o.dongXe:(o.model!=null?o.model:'')).trim(),
    viTri:parseSlot(o.viTri!=null?o.viTri:o.slot),
    tenBoPhan:String(o.tenBoPhan!=null?o.tenBoPhan:(o.boPhan!=null?o.boPhan:(o.ten||''))).trim(),
    trangThaiVao:String(o.trangThaiVao!=null?o.trangThaiVao:'').trim(),
    ngayVao:normDate(o.ngayVao!=null?o.ngayVao:o.entryDate),
    trangThaiRa:ttRa,
    ngayRa:ngayRa,
    ghiChu:String(o.ghiChu!=null?o.ghiChu:(o.note||'')).trim(),
    status:st,
    updatedAt:o.updatedAt||Date.now()
  };
}

/* ================= FIREBASE ================= */
function loadFb(){
  try{var c=JSON.parse(localStorage.getItem(LS_FB)||'null');if(c)return Object.assign({},DEFAULT_FB,c);}catch(e){}
  return Object.assign({},DEFAULT_FB);
}
function updateDot(){
  var on=fbConfigured&&fbConnected;
  ['hdot','sdot'].forEach(function(i){var d=$(i);if(d)d.classList.toggle('on',on);});
  var t=on?'Đã kết nối':(fbConfigured?'Offline':'Chưa cấu hình');
  $('htxt').textContent=on?'Online':'Offline';
  $('stxt').textContent=' '+t;
  var cs=$('cfgStatus');if(cs){cs.textContent=t;cs.style.background=on?'#e3f7ec':'#fdecea';cs.style.color=on?'#12a150':'#d92d20';}
}
function initFirebase(){
  var cfg=loadFb();
  if(!cfg.databaseURL||typeof firebase==='undefined'){fbConfigured=false;updateDot();return;}
  try{
    var conf={databaseURL:cfg.databaseURL};
    if(cfg.apiKey)conf.apiKey=cfg.apiKey;
    if(cfg.projectId)conf.projectId=cfg.projectId;
    var app=firebase.initializeApp(conf);
    var db=firebase.database(app);
    fbConfigured=true;
    db.ref('.info/connected').on('value',function(s){fbConnected=!!s.val();updateDot();});
    fbRef=db.ref(DB_PATH);
    cfgRef=db.ref(CFG_PATH);
    fbRef.on('value',function(snap){onRemote(snap.val()||{});},function(err){toast('Firebase lỗi: '+(err&&err.code||'không rõ'));});
    cfgRef.on('value',function(snap){onCfgRemote(snap.val());},function(){});
  }catch(e){fbConfigured=false;fbRef=null;cfgRef=null;toast('Lỗi khởi tạo Firebase');}
  updateDot();
}
function onRemote(remote){
  var changed=false, local={};
  sessions.forEach(function(s){local[s.id]=s;});
  Object.keys(remote).forEach(function(id){
    var r=remote[id];if(!r||typeof r!=='object')return;
    if(tombstones[id]){try{fbRef.child(id).remove();}catch(e){}return;}
    r=normSession(Object.assign({},r,{id:id,updatedAt:r.updatedAt||0}));
    var l=local[id];
    if(!l){sessions.push(r);changed=true;}
    else if((r.updatedAt||0)>(l.updatedAt||0)){sessions[sessions.indexOf(l)]=r;changed=true;}
    else if((l.updatedAt||0)>(r.updatedAt||0)){pushOne(l);}
  });
  Object.keys(tombstones).forEach(function(id){if(!remote[id]&&remoteKnown[id]!==undefined)delete tombstones[id];});
  var keep=[], cfgCh=false;
  sessions.forEach(function(s){
    if(!remote[s.id]){
      if(remoteKnown[s.id]){changed=true;return;}
      pushOne(s);
    }
    var d=slotDay(s.viTri);if(d&&ensureDay(d))cfgCh=true;
    keep.push(s);
  });
  sessions=keep;
  if(cfgCh)saveConfig();
  remoteKnown={};Object.keys(remote).forEach(function(k){remoteKnown[k]=1;});
  if(changed){saveLocal();render();}
}
function syncNow(){
  if(!fbRef){toast('Chưa cấu hình Firebase');return;}
  showLoading('Đang đồng bộ...');
  Promise.all([fbRef.once('value'),cfgRef.once('value')]).then(function(r){
    onRemote(r[0].val()||{});onCfgRemote(r[1].val());pushAll();pushCfg();hideLoading();toast('Đã đồng bộ xong ✔');
  }).catch(function(e){hideLoading();toast('Đồng bộ lỗi: '+(e&&e.code||'mạng'));});
}
function reloadFromCloud(){
  if(!fbRef){toast('Chưa cấu hình Firebase');return;}
  if(!confirm('Thay toàn bộ dữ liệu trên máy bằng dữ liệu từ Cloud?'))return;
  showLoading('Đang tải từ Cloud...');
  Promise.all([fbRef.once('value'),cfgRef.once('value')]).then(function(r){
    var v=r[0].val()||{};
    sessions=Object.keys(v).map(function(id){return normSession(Object.assign({},v[id],{id:id,updatedAt:v[id].updatedAt||Date.now()}));});
    if(r[1].val()){appCfg=normCfg(r[1].val());try{localStorage.setItem(LS_APP,JSON.stringify(appCfg));}catch(e){}}
    sessions.forEach(function(s){var d=slotDay(s.viTri);if(d)ensureDay(d);});
    tombstones={};remoteKnown={};Object.keys(v).forEach(function(k){remoteKnown[k]=1;});
    saveLocal();hideLoading();render();toast('Đã tải '+sessions.length+' lượt xe từ Cloud');
  }).catch(function(e){hideLoading();toast('Tải lỗi: '+(e&&e.code||'mạng'));});
}
function saveFb(){
  var cfg={apiKey:$('c_key').value.trim(),databaseURL:$('c_url').value.trim().replace(/\/+$/,''),projectId:$('c_pid').value.trim()};
  if(!/^https:\/\/.+/.test(cfg.databaseURL)){toast('databaseURL phải bắt đầu bằng https://');return;}
  localStorage.setItem(LS_FB,JSON.stringify(cfg));
  toast('Đã lưu cấu hình, đang tải lại...');

function testFb(){
  var url=$('c_url').value.trim().replace(/\/+$/,'');
  if(!url){toast('Nhập databaseURL');return;}
  showLoading('Đang kiểm tra kết nối...');
  var ctrl=('AbortController' in window)?new AbortController():null;
  var to=setTimeout(function(){if(ctrl)ctrl.abort();},9000);
  fetch(url+'/.json?shallow=true',{signal:ctrl?ctrl.signal:undefined}).then(function(r){
    clearTimeout(to);hideLoading();
    if(r.ok)toast('Kết nối OK ✔ (đọc được database)');
    else if(r.status===401||r.status===403)toast('Database từ chối (Rules chưa cho phép đọc/ghi)');
    else toast('Lỗi HTTP '+r.status);

}

function hay(s){

  return stripAcc([s.bienSo,s.vin6,s.mauXe,s.soChia,s.dongXe,s.tenBoPhan,s.trangThaiVao,s.trangThaiRa,sl,s.loai==='moi'?'xe moi chua bien':'xe cu co bien'].join(' | '));
}
function matches(s,q){
  var qp=normPlate(q), qt=stripAcc(q).trim();
  if(!qt&&!qp)return true;
  if(qp&&(s.bienSo.indexOf(qp)>=0||(s.vin6&&s.vin6.indexOf(qp)>=0)))return true;
  return hay(s).indexOf(qt)>=0;
}

function addDay(){

  if(!confirm('Thêm Dãy '+n+' ('+(COLS.length*ROWS)+' vị trí)?'))return;

/* ---- Touch drag & drop (long-press) ---- */
var drag={timer:null,on:false,id:null,ghost:null,sx:0,sy:0,suppress:false,tgt:null};
function dragEnd(){
  clearTimeout(drag.timer);
  if(drag.ghost){drag.ghost.remove();drag.ghost=null;}
  if(drag.tgt){drag.tgt.classList.remove('target');drag.tgt=null;}
  if(drag.on){drag.on=false;drag.suppress=true;setTimeout(function(){drag.suppress=false;},450);}
}
document.addEventListener('touchstart',function(e){
  var c=e.target.closest&&e.target.closest('.cell.occ[data-id]');
  if(!c||e.touches.length!==1)return;
  var t=e.touches[0];drag.sx=t.clientX;drag.sy=t.clientY;
  clearTimeout(drag.timer);
  drag.timer=setTimeout(function(){
    drag.on=true;drag.id=c.getAttribute('data-id');
    var g=document.createElement('div');g.className='ghost';g.textContent=c.querySelector('.pl').textContent;
    document.body.appendChild(g);drag.ghost=g;g.style.left=drag.sx+'px';g.style.top=drag.sy+'px';
    if(navigator.vibrate)navigator.vibrate(30);
  },380);
},{passive:true});
document.addEventListener('touchmove',function(e){
  var t=e.touches[0];
  if(!drag.on){if(Math.abs(t.clientX-drag.sx)>10||Math.abs(t.clientY-drag.sy)>10)clearTimeout(drag.timer);return;}
  e.preventDefault();
  drag.ghost.style.left=t.clientX+'px';drag.ghost.style.top=t.clientY+'px';
  var el=document.elementFromPoint(t.clientX,t.clientY),c=el&&el.closest?el.closest('.cell[data-slot]:not(.occ)'):null;
  if(drag.tgt&&drag.tgt!==c)drag.tgt.classList.remove('target');
  if(c)c.classList.add('target');
  drag.tgt=c;
},{passive:false});
document.addEventListener('touchend',function(e){
  if(!drag.on){clearTimeout(drag.timer);return;}
  var t=e.changedTouches[0],id=drag.id;
  var el=document.elementFromPoint(t.clientX,t.clientY);
  var c=el&&el.closest?el.closest('.cell[data-slot]:not(.occ)'):null;
  var un=el&&el.closest?el.closest('#unCard'):null;
  dragEnd();
  if(c)assignSlot(id,c.getAttribute('data-slot'),true);
  else if(un){var s=findS(id);if(s){s.viTri='';upsert(s);toast('Đã đưa về danh sách chưa xếp');}}
},{passive:true});
document.addEventListener('touchcancel',dragEnd,{passive:true});
document.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('.cell'))e.preventDefault();});

function saveForm(id){
  var s=id?findS(id):null, exited=s&&s.status==='exited';
  var loai=formType, bs='', vin='';
  if(loai==='cu'){
    bs=normPlate($('f_bs').value);
    if(!bs){toast('Vui lòng nhập biển số');$('f_bs').focus();return;}
  }else{
    vin=normVin($('f_vin').value);
    if(vin.length!==6){toast('Nhập đủ 6 số cuối khung VIN');$('f_vin').focus();return;}
  }
  var key=loai==='moi'?('VIN:'+vin):bs;
  if(!exited&&sessions.some(function(x){return x.status==='in_lot'&&sKey(x)===key&&x.id!==id;})){toast('Xe '+(loai==='moi'?'VIN '+vin:bs)+' đang có trong bãi, chưa xuất!');return;}
  var nv=$('f_nv').value.trim();
  if(!nv&&!id)nv=today();
  if(nv&&!validDate(nv)){toast('Ngày vào không hợp lệ (DD/MM/YYYY)');return;}
  var vt=s?s.viTri:'';
  if(!exited){
    vt=$('f_vt').value;
    if($('f_day').value&&!vt)vt='';
    if(vt){var oc=occMap()[vt];if(oc&&oc.id!==id){toast('Ô '+vt+' đã có xe');return;}}
  }
  var obj=s?Object.assign({},s):{id:genId(),status:'in_lot',trangThaiRa:'',ngayRa:''};
  obj.loai=loai;obj.bienSo=bs;obj.vin6=vin;
  obj.mauXe=loai==='moi'?$('f_mau').value.trim():'';
  obj.soChia=loai==='moi'?$('f_chia').value.trim():'';
  obj.dongXe=$('f_model').value.trim();obj.tenBoPhan=$('f_bp').value.trim();obj.trangThaiVao=$('f_tt').value.trim();
  obj.ngayVao=nv;obj.viTri=vt;obj.ghiChu=$('f_gc').value.trim();
  if(exited){
    var nr=$('f_nr').value.trim();
    if(nr&&!validDate(nr)){toast('Ngày xuất không hợp lệ');return;}
    obj.ngayRa=nr;obj.trangThaiRa=$('f_tr').value.trim();
  }
  upsert(obj);closeModal();toast(id?'Đã cập nhật':'Đã nhập xe '+(loai==='moi'?'VIN '+vin:bs));
}

/* ================= REPORT (landscape dashboard) ================= */
function repPeriod(){
  var a=parseD(rep.anchor),st,en,label;
  if(rep.mode==='tuychon'){
    st=parseD(rep.from);en=parseD(rep.to);
    if(isNaN(st)||isNaN(en)||en<st||(en-st)/DAY_MS>61)return null;
    label='Tùy chọn • '+strD(st)+' - '+strD(en);
  }else{
    if(isNaN(a))return null;
    if(rep.mode==='ngay'){st=en=a;label='Ngày • '+strD(a);}
    else if(rep.mode==='tuan'){var dow=(new Date(a).getUTCDay()+6)%7;st=a-dow*DAY_MS;en=st+6*DAY_MS;label='Tuần • '+strD(st)+' - '+strD(en);}
    else{var d=new Date(a);st=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1);en=Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0);label='Tháng • '+pad(d.getUTCMonth()+1)+'/'+d.getUTCFullYear()+' ('+strD(st)+' - '+strD(en)+')';}
  }
  return {start:st,end:en,label:label,sk:dateKey(strD(st)),ek:dateKey(strD(en))};
}
function inPeriod(ds,p){var k=dateKey(ds);return !!k&&k>=p.sk&&k<=p.ek;}
function repCandidates(p){
  return sessions.filter(function(s){return s.ghiChu&&(inPeriod(s.ngayVao,p)||inPeriod(s.ngayRa,p));});
}
function repData(){
  var p=repPeriod();if(!p)return null;
  var t=parseD(today()),inLot=sessions.filter(function(s){return s.status==='in_lot';});
  var cu=inLot.filter(function(s){return s.loai!=='moi';}).length,mo=inLot.length-cu;
  var ages=[0,0,0,0],missIn=0;
  inLot.forEach(function(s){
    var a=parseD(s.ngayVao);
    if(isNaN(a)){missIn++;ages[3]++;return;}
    var d=Math.round((t-a)/DAY_MS);if(d<0)d=0;
    ages[d<=10?0:d<=20?1:d<=31?2:3]++;
  });
  var bars=[];
  for(var ms=p.start;ms<=p.end;ms+=DAY_MS){
    if(ms>t){bars.push({ms:ms,future:true});continue;}
    var k=dateKey(strD(ms)),c=0,m=0;
    sessions.forEach(function(s){
      var vk=dateKey(s.ngayVao);if(vk&&vk>k)return;
      var rk=dateKey(s.ngayRa);
      if(!(s.status==='in_lot'||(rk&&rk>k)))return;
      if(s.loai==='moi')m++;else c++;
    });
    bars.push({ms:ms,c:c,m:m});
  }
  var exitedIn=sessions.filter(function(s){return s.status==='exited'&&inPeriod(s.ngayRa,p);});
  var notes=[];
  repCandidates(p).forEach(function(s){if(rep.sel[s.id])notes.push('• '+dispKey(s)+': '+s.ghiChu);});
  if(rep.text.trim())notes.unshift(rep.text.trim());
  return {p:p,total:inLot.length,cu:cu,mo:mo,old11:ages[1]+ages[2]+ages[3],ages:ages,missIn:missIn,
    missOut:sessions.filter(function(s){return s.status==='exited'&&!validDate(s.ngayRa);}).length,
    bars:bars,vao:sessions.filter(function(s){return inPeriod(s.ngayVao,p);}).length,
    ra:exitedIn.length,moiRa:exitedIn.filter(function(s){return s.loai==='moi';}).length,notes:notes};
}

  var gl=ticks.map(function(v,i){return '<div class="gl" style="bottom:calc((100% - 16px)*'+(i/3)+')"><span>'+v+'</span></div>';}).join('');
  var cols=d.bars.map(function(b){

     '<div class="kp" style="border-top-color:#dc2626"><div class="l">XE TỒN TỪ 11 NGÀY</div><div class="n" style="color:#dc2626">'+d.old11+'</div></div></div>';
  h+='<div class="mid"><div class="cd"><h2>Diễn biến xe tồn bãi trong kỳ</h2><div class="sub">Số xe còn tại bãi cuối mỗi ngày · So sánh xe cũ và xe mới</div>'+

  h+='<div class="ft">Mốc tồn đã kiểm: '+today()+' ('+d.total+' xe đang ở bãi). Hồ sơ thiếu ngày vào được tính tồn trên 31 ngày, không tự gán ngày. Xe thiếu ngày vào: '+d.missIn+', lượt xuất thiếu ngày: '+d.missOut+'.</div></div>';

}

async function makeReport(){
  var d=repData();

    if(typeof html2canvas==='undefined')throw new Error('Thiếu thư viện html2canvas (cần mạng lần đầu)');
    var host=$('reportHost');
    host.innerHTML=buildReportHTML(d);
    await new Promise(function(r){setTimeout(r,150);});

    var scale=Math.min(2,14000/Math.max(el.offsetHeight,1));
    var canvas=await html2canvas(el,{scale:scale,useCORS:true,backgroundColor:'#f0f4f9',logging:false,windowWidth:1200});

    $('prevWrap').innerHTML='<img id="prevImg" src="'+url+'" alt="Báo cáo" onclick="viewBig(this.src)"><div class="hint">Chạm vào ảnh để xem cỡ lớn.</div><div class="row" style="margin-top:8px"><button class="btn sec" onclick="downloadReport()">⬇️ Tải PNG</button>'+(canShare?'<button class="btn grn" onclick="shareReport()">📤 Chia sẻ (Zalo)</button>':'')+'</div>';
    downloadReport();
    toast('Đã tạo ảnh báo cáo ✔');
  }catch(e){toast('Lỗi tạo ảnh: '+(e&&e.message||e));}
  finally{hideLoading();$('reportHost').innerHTML='';}
}

    var ws=XLSX.utils.json_to_sheet(rows,{header:hdr});

function pickFile(kind){

  f.onchange=function(){if(f.files&&f.files[0])importFile(kind,f.files[0]);};

function mergeImported(list){
  var occ=occMap(),added=0,skipped=0,cfgCh=false;
  list.forEach(function(o){
    var s=normSession(o);
    if(!(s.bienSo||s.vin6)){skipped++;return;}
    var existing=o.id?findS(s.id):null;
    var dup=sessions.some(function(x){return sKey(x)===sKey(s)&&x.ngayVao===s.ngayVao&&x.status===s.status&&x.ngayRa===s.ngayRa&&x.id!==s.id;});
    if(!existing&&dup){skipped++;return;}
    if(s.status==='in_lot'){
      if(!existing&&sessions.some(function(x){return x.status==='in_lot'&&sKey(x)===sKey(s)&&x.id!==s.id;})){skipped++;return;}
      if(s.viTri&&occ[s.viTri]&&occ[s.viTri].id!==s.id)s.viTri='';
      if(s.viTri)occ[s.viTri]=s;
    }else s.viTri='';
    var dd=slotDay(s.viTri);if(dd&&ensureDay(dd))cfgCh=true;
    if(addToList('dongXe',s.dongXe))cfgCh=true;
    if(addToList('boPhan',s.tenBoPhan))cfgCh=true;
    if(addToList('ttVao',s.trangThaiVao))cfgCh=true;
    if(addToList('ttRa',s.trangThaiRa))cfgCh=true;
    s.updatedAt=Date.now();
    var i=sessions.findIndex(function(x){return x.id===s.id;});
    if(i>=0)sessions[i]=s;else sessions.push(s);
    delete tombstones[s.id];
    added++;
  });
  if(cfgCh)saveConfig();
  saveLocal();pushAll();render();
  toast('Nhập '+added+' lượt xe'+(skipped?', bỏ qua '+skipped+' dòng trùng/lỗi':''));
}
function importFile(kind,file){
  showLoading('Đang đọc file...');
  var rd=new FileReader();
  rd.onerror=function(){hideLoading();toast('Không đọc được file');};
  rd.onload=function(){
    try{
      var list;
      if(kind==='json'){
        var j=JSON.parse(rd.result);
        if(j&&j.config&&!Array.isArray(j)){
          var c=normCfg(j.config),ch=false;
          c.days.forEach(function(d){if(ensureDay(d))ch=true;});
          Object.keys(DEF_LISTS).forEach(function(k){c.lists[k].forEach(function(v){if(addToList(k,v))ch=true;});});
          if(ch)saveConfig();
        }
        list=Array.isArray(j)?j:(j.sessions||j.vehicles||j.data||[]);
        if(!Array.isArray(list))list=Object.keys(list).map(function(k){return Object.assign({id:k},list[k]);});
      }else{
        if(typeof XLSX==='undefined')throw new Error('Thiếu thư viện SheetJS');
        var wb=XLSX.read(rd.result,{type:'array',cellDates:true});
        var ws=wb.Sheets[wb.SheetNames[0]];
        list=XLSX.utils.sheet_to_json(ws,{defval:''}).map(function(r){return {
          bienSo:r['Biển số'],dongXe:r['Dòng xe'],viTri:r['Vị trí'],tenBoPhan:r['Tên/Bộ phận'],
          ngayVao:r['Ngày vào'],trangThaiVao:r['Trạng thái vào'],ngayRa:r['Ngày xuất'],trangThaiRa:r['Trạng thái xuất'],ghiChu:r['Ghi chú'],
          loai:r['Loại xe'],vin6:r['6 số cuối VIN'],mauXe:r['Màu xe'],soChia:r['Số chìa khóa']};});
      }
      mergeImported(list);
    }catch(e){toast('File không hợp lệ: '+(e&&e.message||e));}
    hideLoading();
  };
  if(kind==='json')rd.readAsText(file,'utf-8');else rd.readAsArrayBuffer(file);
}

loadAppCfg();

render();
initFirebase();
</script>
