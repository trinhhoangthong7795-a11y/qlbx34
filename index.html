function loadState(){try{const x=JSON.parse(localStorage.getItem(DB_KEY)||'{}');return {vehicles:Array.isArray(x.vehicles)?x.vehicles:[],catalogs:{...DEFAULT_CATALOGS,...(x.catalogs||{})}}}catch(e){return {vehicles:[],catalogs:structuredCloneSafe(DEFAULT_CATALOGS)}}}
function structuredCloneSafe(x){return JSON.parse(JSON.stringify(x))}
function saveState(){localStorage.setItem(DB_KEY,JSON.stringify(state));localDirty=true;scheduleSync()}
function todayISO(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function fmtDate(x){if(!x)return 'Chưa có ngày nhập';let d;if(/^\d{4}-\d\d-\d\d$/.test(String(x)))d=new Date(x+'T00:00:00');else{const m=String(x).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);d=m?new Date(+m[3],+m[2]-1,+m[1]):new Date(x)}return isNaN(d)?'Chưa có ngày nhập':new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'}).format(d)}
function ageDays(x){if(!x)return null;let d;if(/^\d{4}-\d\d-\d\d$/.test(String(x)))d=new Date(x+'T00:00:00');else{const m=String(x).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);d=m?new Date(+m[3],+m[2]-1,+m[1]):new Date(x)}if(isNaN(d))return null;const now=new Date(todayISO()+'T00:00:00');return Math.max(0,Math.floor((now-d)/86400000))}
function normId(x){return String(x||'').toUpperCase().replace(/[.\-\s]/g,'').trim()}
function inYard(v){const status=String(v.status||v.currentStatus||'').toLowerCase();if(['đang ở bãi','đang trong bãi','trong bãi','in_yard','inside','đang tồn','in_lot'].includes(status))return true;if(status==='đã xuất bãi'||status==='exited'||status==='out')return false;const c=currentCycle(v);return !!(v.cycles?.length)&&!(c.exitDate||c.dateOut||c.ngayXuat)}
function currentCycle(v){return (v.cycles||[]).slice(-1)[0]||{}}
function vehicleTypeOf(v){return v.vehicleType||v.type||''}
function entryDate(v){const c=currentCycle(v);return c.entryDate||c.dateIn||v.entryDate||''}
function initialEntryDate(v){const first=(v.cycles||[])[0]||{};const d=first.entryDate||first.dateIn||v.initialEntryDate||v.entryDate||'';return d||''}
function agingEndDate(v){if(inYard(v))return todayISO();const cycles=v.cycles||[];for(let i=cycles.length-1;i>=0;i--){const d=cycles[i].exitDate||cycles[i].dateOut||cycles[i].ngayXuat;if(d)return d}return todayISO()}
function vehicleAgeDays(v){const start=parseDateValue(initialEntryDate(v));if(!start)return null;const end=parseDateValue(agingEndDate(v));if(!end)return null;return Math.max(0,Math.floor((end-start)/86400000))}
function ageLabel(v){const n=vehicleAgeDays(v);return n===null?'Không rõ ngày nhập (>31 ngày)':n+' ngày'}
function position(v){return v.position||v.currentPosition||v.slot||'Chờ gán vị trí'}
function showToast(msg,type='success'){const el=document.getElementById('toast');el.textContent=msg;el.className='toastbox '+type+' show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500)}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

 const view=captureYardView();

function slotCodes(){const a=[];for(let r=1;r<=20;r++)for(const p of ['T','TLD','PLD','P'])a.push(p+'-'+String(r).padStart(2,'0'));return a}
function renderYard(view=null,targetId='yard'){

  const codes=slotCodes().map(s=>d+s), count=liveVehicles().filter(v=>position(v)!=='Chờ gán vị trí'&&position(v).startsWith(d)).length, free=80-count;
  const panel=document.createElement('section');panel.className='panel'+(snapshot.rows.has(d)?'':' collapsed');panel.dataset.row=d;panel.innerHTML=`<div class="panelhead"><div><h2>▦ Dãy ${d}</h2><div class="summary">${count}/80 vị trí có xe · ${free} chỗ trống</div></div><span>⌄</span></div><div class="panelbody"><div class="yardgrid">${codes.map(code=>{const v=liveVehicles().find(x=>position(x)===code);const cls=!v?'empty':vehicleTypeOf(v)==='Xe cũ'?'old':'new';return `<button class="slot ${cls}" data-slot="${code}"><b>${code}</b><span>${v?esc(v.id):'Trống'}</span></button>`}).join('')}</div></div>`;

function renderInventory(){document.getElementById('inventory').innerHTML=liveVehicles().map(v=>`<tr><td><b>${esc(v.id)}</b></td><td>${esc(vehicleTypeOf(v))}</td><td>${esc(v.model||'')}</td><td>${esc(position(v))}</td><td>${esc(fmtDate(initialEntryDate(v)))}</td><td><span class="age-pill ${vehicleAgeDays(v)===null||vehicleAgeDays(v)>31?'warn':''}">${esc(ageLabel(v))}</span></td><td><button class="btn small" data-detail="${esc(v.id)}">Chi tiết</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted">Bãi hiện chưa có xe.</td></tr>'}
document.addEventListener('click',e=>{const d=e.target.closest('[data-detail]');if(d){showVehicle(d.dataset.detail);return}const s=e.target.closest('[data-slot]');if(s)slotAction(s.dataset.slot)});
function showVehicle(id){const v=state.vehicles.find(x=>normId(x.id)===normId(id));if(!v)return;activeVehicleId=v.id;const c=currentCycle(v);openModal(`<h3>Hồ sơ xe ${esc(v.id)}</h3><div class="grid grid-cols-2 gap-2 text-sm"><div>Loại xe: <b>${esc(vehicleTypeOf(v))}</b></div><div>Dòng xe: <b>${esc(v.model||'')}</b></div><div>Màu: <b>${esc(v.color||'')}</b></div><div>Vị trí: <b>${esc(position(v))}</b></div><div>Ngày nhập Chu kỳ 1: <b>${esc(fmtDate(initialEntryDate(v)))}</b></div><div>Số ngày tồn: <b>${esc(ageLabel(v))}</b></div><div>Chìa khóa: <b>${esc(v.keyStatus||'')}</b></div><div>Tình trạng vào: <b>${esc(c.entryCondition||'')}</b></div><div>Trạng thái: <b>${esc(v.status||'')}</b></div></div><div class="mt-3 text-sm font-bold">Lịch sử (${(v.cycles||[]).length}/10 chu kỳ)</div><div class="mt-2 space-y-2">${(v.cycles||[]).map((x,i)=>`<div class="p-2 rounded-lg bg-slate-50 text-xs">Chu kỳ ${i+1}: Vào ${esc(fmtDate(x.entryDate))} ${esc(x.entryCondition||'')} · Ra ${esc(fmtDate(x.exitDate))} · ${esc(x.exitReason||'')}</div>`).join('')}</div><div class="actions"><button class="btn primary" id="detailExit">Xuất xe</button><button class="btn" id="detailEdit">Sửa thông tin</button><button class="btn" id="detailKick">Kích xe ra ô</button><button class="btn red" id="detailDelete">Xóa hồ sơ</button></div><div class="actions"><button class="btn gray" id="detailClose">Đóng</button></div>`);
 document.getElementById('detailClose').onclick=closeModal;document.getElementById('detailExit').onclick=()=>openExit(v.id);document.getElementById('detailEdit').onclick=()=>openEntry(v.id,true);document.getElementById('detailKick').onclick=()=>kickVehicle(v.id);document.getElementById('detailDelete').onclick=()=>confirmDelete(v.id)}
function options(list,current){return '<option value="">-- Không chọn --</option>'+list.map(x=>`<option ${x===current?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}
function catalogField(label,key,id){return `<div class="field"><label>${label}</label><div class="rowselect"><select id="${id}">${options(state.catalogs[key]||[])}</select><button class="btn small" data-catadd="${key}" type="button">+</button><button class="btn small red" data-catdel="${key}" type="button">🗑</button></div></div>`}
document.addEventListener('click',e=>{const a=e.target.closest('[data-catadd]');if(a)catalogAdd(a.dataset.catadd);const d=e.target.closest('[data-catdel]');if(d)catalogDelete(d.dataset.catdel,d.parentElement.querySelector('select'))});

function catalogDelete(key,sel){const val=sel?.value;if(!val)return showToast('Chọn danh mục cần xóa','warn');openModal(`<h3>Xóa danh mục?</h3><p>Bạn có chắc muốn xóa “${esc(val)}” khỏi danh mục?</p><div class="actions"><button class="btn red" id="catDelYes">Xóa</button><button class="btn gray" onclick="closeModal()">Hủy</button></div>`);document.getElementById('catDelYes').onclick=()=>{state.catalogs[key]=state.catalogs[key].filter(x=>x!==val);saveState();closeModal();render();showToast('Đã xóa danh mục')}}
function openEntry(id='',edit=false,forcedPosition=''){
 const v=edit?state.vehicles.find(x=>normId(x.id)===normId(id)):null,c=v?currentCycle(v):{};
 openModal(`<h3>${edit?'Sửa hồ sơ xe':'Nhập xe vào bãi'}</h3><div class="formgrid">

 <div class="field"><label>Biển số / 6 số cuối VIN</label><input id="fId" value="${esc(v?.id||'')}" ${edit?'readonly':''} placeholder="Nhập mã xe"></div>
 <div class="field">${catalogField('Dòng xe','models','fModel')}</div>
 <div class="field">${catalogField('Màu xe','colors','fColor')}</div>
 <div class="field">${catalogField('Tình trạng vào','entryStatuses','fCond')}</div>
 <div class="field"><label>Chìa khóa</label><select id="fKey">${options(KEY_STATUSES)}</select></div>
 <div class="field">${catalogField('Tên / Bộ phận (Thông/Kho)','staffDepts','fStaff')}</div>

 <div class="field full"><label>Vị trí đỗ (để trống nếu chưa gán)</label><select id="fPosition"><option value="">Chờ gán vị trí</option>${allFreeSlots(v?.position).map(x=>`<option ${x===(forcedPosition||v?.position)?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field full"><label>Ghi chú</label><textarea id="fNote">${esc(c.note||v?.note||'')}</textarea></div>
 </div><div id="duplicateWarning"></div><div id="returningNotice" class="notice" style="display:none;background:#eaf7ef;color:#087344"></div><div class="actions"><button class="btn primary" id="saveEntry">${edit?'Lưu thay đổi':'Lưu nhập xe'}</button><button class="btn gray" onclick="closeModal()">Hủy</button></div>`);
 if(v){document.getElementById('fModel').value=v.model||'';document.getElementById('fColor').value=v.color||'';document.getElementById('fStaff').value=c.entryStaff||'';document.getElementById('fCond').value=c.entryCondition||'';document.getElementById('fKey').value=v.keyStatus||''}
 const idInput=document.getElementById('fId'), save=document.getElementById('saveEntry');
 function checkDuplicate(){const key=normId(idInput.value);const dup=state.vehicles.find(x=>normId(x.id)===key&&inYard(x)&&(!edit||normId(x.id)!==normId(v.id)));const warn=document.getElementById('duplicateWarning'),notice=document.getElementById('returningNotice');if(dup){warn.innerHTML=`<div class="notice danger">Mã xe đang tồn tại tại vị trí: ${esc(position(dup))}. Không thể nhập trùng.</div>`;save.disabled=true;save.style.opacity='.45';notice.style.display='none'}else{warn.innerHTML='';save.disabled=false;save.style.opacity='1';const prior=!edit&&key?state.vehicles.find(x=>normId(x.id)===key&&!inYard(x)):null;if(prior){const cycles=prior.cycles||[];if(cycles.length>=MAX_CYCLES){notice.textContent='Hồ sơ đã đủ 10 chu kỳ Vào/Ra, không thể nhập thêm.';notice.style.display='block';save.disabled=true;save.style.opacity='.45';return;}if(prior.model){const sel=document.getElementById('fModel');if(![...sel.options].some(o=>o.value===prior.model))sel.add(new Option(prior.model,prior.model));sel.value=prior.model}if(prior.color){const sel=document.getElementById('fColor');if(![...sel.options].some(o=>o.value===prior.color))sel.add(new Option(prior.color,prior.color));sel.value=prior.color}notice.textContent=`🔄 Xe quay lại bãi (Chu kỳ thứ ${cycles.length+1}) – Đã tự động điền dòng xe`;notice.style.display='block'}else{notice.style.display='none'}}}
 idInput.addEventListener('input',checkDuplicate);checkDuplicate();
 save.onclick=()=>{const raw=idInput.value.trim(),type=document.getElementById('fType').value;const clean=type==='Xe cũ'?normId(raw):raw.replace(/\D/g,'').slice(-6);if(!clean)return showToast(type==='Xe cũ'?'Cần nhập biển số':'Cần nhập 6 số cuối VIN','error');if(type==='Xe mới'&&!/^\d{6}$/.test(clean))return showToast('VIN phải có đúng 6 chữ số cuối','error');const dup=state.vehicles.find(x=>normId(x.id)===normId(clean)&&inYard(x)&&(!edit||normId(x.id)!==normId(v.id)));if(dup)return showToast('Xe đang tồn tại: '+position(dup),'error');
 const date=document.getElementById('fMissing').checked?'':document.getElementById('fDate').value;const pos=document.getElementById('fPosition').value;let target=v;
 if(edit){target.model=document.getElementById('fModel').value;target.color=document.getElementById('fColor').value;target.position=pos;target.note=document.getElementById('fNote').value;target.keyStatus=document.getElementById('fKey').value;if(c){c.entryCondition=document.getElementById('fCond').value;c.entryStaff=document.getElementById('fStaff').value;c.note=document.getElementById('fNote').value}target.vehicleType=type;target.updatedAt=new Date().toISOString();if(c && !c.entryDate)c.entryDate=date;const first=(target.cycles||[])[0]||{};target.missingInitialEntryDate=!(first.entryDate||first.dateIn||target.initialEntryDate||target.entryDate)}
 else{target=state.vehicles.find(x=>normId(x.id)===normId(clean));if(!target)target={id:clean,cycles:[],vehicleType:type};if(!target.cycles)target.cycles=[];if(target.cycles.length>=MAX_CYCLES)target.cycles=target.cycles.slice(-(MAX_CYCLES-1));target.cycles.push({entryDate:date,entryStaff:document.getElementById('fStaff').value,entryCondition:document.getElementById('fCond').value,entryAt:new Date().toISOString(),note:document.getElementById('fNote').value});target.status='Đang ở bãi';target.keyStatus=document.getElementById('fKey').value||target.keyStatus||'';target.vehicleType=type;target.model=document.getElementById('fModel').value;target.color=document.getElementById('fColor').value;target.position=pos||'';const first=(target.cycles||[])[0]||{};target.missingInitialEntryDate=!(first.entryDate||first.dateIn||target.initialEntryDate||target.entryDate);target.updatedAt=new Date().toISOString();if(!state.vehicles.some(x=>normId(x.id)===normId(clean)))state.vehicles.push(target)}
 saveState();closeModal();render();showToast(edit?'Đã cập nhật hồ sơ':'Đã nhập xe thành công')};

function allFreeSlots(allow=''){const used=new Set(liveVehicles().filter(v=>v.position&&v.position!==allow).map(v=>v.position));const out=[];for(let d=1;d<=5;d++)for(let r=1;r<=20;r++)for(const p of ['T','TLD','PLD','P']){const x=d+p+'-'+String(r).padStart(2,'0');if(!used.has(x))out.push(x)}return out}
function openExit(id){const v=state.vehicles.find(x=>normId(x.id)===normId(id));if(!v||!inYard(v)||!(v.cycles||[]).length)return showToast('Không thể xuất: xe chưa nhập hoặc đã xuất bãi','error');const c=currentCycle(v);openModal(`<h3>Xuất xe khỏi bãi</h3><div class="p-3 rounded-xl bg-slate-50 text-sm mb-3"><b>${esc(v.id)}</b> · ${esc(v.model||'')} · ${esc(v.color||'')}<br>Vị trí: ${esc(position(v))}</div><div class="formgrid"><div class="field">${catalogField('Tên / Bộ phận','staffDepts','xStaff')}</div><div class="field">${catalogField('Lý do xuất','reasons','xReason')}</div><div class="field full"><label>Ngày xuất</label><input type="date" id="xDate" value="${todayISO()}"></div><div class="field full"><label>Ghi chú</label><textarea id="xNote"></textarea></div></div><div class="actions"><button class="btn primary" id="doExit">Xác nhận xuất xe</button><button class="btn gray" onclick="closeModal()">Hủy</button></div>`);document.getElementById('doExit').onclick=()=>{const cycle=currentCycle(v);cycle.exitDate=document.getElementById('xDate').value;cycle.exitStaff=document.getElementById('xStaff').value;cycle.exitReason=document.getElementById('xReason').value;cycle.exitNote=document.getElementById('xNote').value;cycle.exitAt=new Date().toISOString();v.status='Đã xuất bãi';v.position='';v.updatedAt=new Date().toISOString();saveState();closeModal();render();showToast('Đã xuất xe, vị trí được giải phóng')}}

function verifyRemoteState(remote,local){

 const key=x=>normId(x.id||x.vehicleId||x.MaXe_ID||'');

 for(const v of lv){const r=remoteMap.get(key(v));if(!r)return false;
  if((v.cycles||[]).length!==(r.cycles||[]).length)throw Error('Lịch sử chu kỳ chưa khớp tại hồ sơ '+v.id);
  const fields=[['vehicleType',vehicleTypeOf(v),vehicleTypeOf(r)],['model',v.model||'',r.model||''],['color',v.color||'',r.color||''],['position',position(v)==='Chờ gán vị trí'?'':position(v),position(r)==='Chờ gán vị trí'?'':position(r)],['status',inYard(v)?'in':'out',inYard(r)?'in':'out'],['keyStatus',v.keyStatus||'',r.keyStatus||''],['missingInitialEntryDate',!!v.missingInitialEntryDate,!!r.missingInitialEntryDate]];
  const mismatch=fields.find(x=>String(x[1])!==String(x[2]));
  if(mismatch)return false;
  const cycleFields=['entryDate','entryStaff','entryCondition','exitDate','exitStaff','note','exitNote'];
  for(let i=0;i<(v.cycles||[]).length;i++){
   for(const field of cycleFields){const a=(v.cycles[i]||{})[field]||'',b=(r.cycles[i]||{})[field]||'';if(String(a)!==String(b))return false}
   const aReason=(v.cycles[i]||{}).exitReason||(v.cycles[i]||{}).reason||'',bReason=(r.cycles[i]||{}).exitReason||(r.cycles[i]||{}).reason||'';
   if(String(aReason)!==String(bReason))return false;
  }
 }
 for(const k of ['models','colors','staffDepts','reasons','entryStatuses']){
  const a=[...(local.catalogs?.[k]||[])].map(String).sort(),b=[...(remote.catalogs?.[k]||[])].map(String).sort();
  if(JSON.stringify(a)!==JSON.stringify(b))return false;
 }
 return true;
}

function parseDateValue(x){
 if(!x)return null;
 if(/^\d{4}-\d\d-\d\d$/.test(String(x)))return new Date(String(x)+'T00:00:00');
 const m=String(x).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
 const d=m?new Date(+m[3],+m[2]-1,+m[1]):new Date(x);
 return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateLabel(d){return new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}
function reportAgeDate(v){
 const first=(v.cycles||[])[0]||{};
 const original=first.entryDate||first.dateIn||v.initialEntryDate||v.entryDate||'';
 return original||'';
}
function reportAgeDays(value,asOf){
 const d=parseDateValue(value);if(!d)return null;
 return Math.max(0,Math.floor((new Date(asOf.getFullYear(),asOf.getMonth(),asOf.getDate())-d)/86400000));
}
function reportSnapshot(day){
 const today=parseDateValue(todayISO());
 return state.vehicles.filter(v=>{
  if(inYard(v)&&!reportAgeDate(v))return true;
  if(dateKey(day)===dateKey(today)&&inYard(v))return true;
  const cycles=v.cycles||[];
  if(!cycles.length)return false;
  return cycles.some(c=>{
   const start=parseDateValue(c.entryDate||c.dateIn),finish=parseDateValue(c.exitDate||c.dateOut);
   return !!start&&start<=day&&(!finish||finish>day);
  });
 });
}
function getReportRange(){
 const mode=document.getElementById('reportPeriodMode')?.value||'week';
 let from,to,label;
 if(mode==='day'){
  from=parseDateValue(document.getElementById('reportDay').value);to=from;
  label='Ngày · '+dateLabel(from);
 }else if(mode==='month'){
  const val=document.getElementById('reportMonth').value||todayISO().slice(0,7),parts=val.split('-').map(Number);

function reportPeriodDates(range){

}
const GSM_SENT='GSM gửi';

function reportBuildHtml(range,special){

 const known=age.filter(x=>x.days!==null&&x.days>30).sort((a,b)=>b.days-a.days),missingA=age.filter(x=>x.days===null),soon=age.filter(x=>x.days!==null&&x.days>=25&&x.days<=30),waitN=live.filter(v=>!position(v)||position(v)==='Chờ gán vị trí').length;
 const list=(arr,n)=>arr.slice(0,n).map(x=>esc(x.v.id)).join(', ')+(arr.length>n?'…':'');

 const box=(t,rs)=>`<div class="rp-card"><h3>${t}</h3>${rs.map(([k,n])=>`<div class="rp-line"><span>${esc(k)}</span><b>${n}</b></div>`).join('')||'<div class="rp-empty">Không có dữ liệu.</div>'}</div>`;

 const spec=special.trim()?esc(special).replace(/\n/g,'<br>'):'<span class="rp-empty">Không có diễn biến đặc biệt được chọn cho kỳ này.</span>';
 return `<div class="rp2" id="reportCanvas"><div class="rp-banner"><h1>BÁO CÁO TỔNG QUAN BÃI XE</h1><p>${esc(range.label)}</p></div>
 <div class="rp-kpis"><div class="rp-kpi" style="--c:#1f3a5f"><span>TỔNG XE TỒN BÃI</span><strong style="color:#1f3a5f">${live.length}</strong></div><div class="rp-kpi" style="--c:#2a85a8"><span>XE CŨ CÓ BIỂN</span><strong style="color:#2a85a8">${old}</strong></div><div class="rp-kpi" style="--c:#5b8c4a"><span>XE MỚI CHƯA BIỂN</span><strong style="color:#5b8c4a">${nw}</strong></div><div class="rp-kpi" style="--c:#c8283a"><span>XE CŨ TỒN TỪ 11 NGÀY</span><strong style="color:#c8283a">${age.filter(x=>isOld(x.v)&&(x.days===null||x.days>=11)).length}</strong></div></div>
 <div class="rp-mid"><div class="rp-panel"><div class="rp-head"><h2>DIỄN BIẾN XE TỒN BÃI TRONG KỲ</h2><div class="rp-legend"><i style="background:#2386a8"></i>Xe cũ<i style="background:#5f8f4a"></i>Xe mới</div></div><div class="rp-sub">Số xe còn tại bãi cuối mỗi ngày · So sánh xe cũ và xe mới</div><div class="rp-chart">${trend}</div></div>
 <div class="rp-panel"><h2>CHỈ TIÊU TRONG KỲ</h2>${m('Lượt xe vào',entries,'#2a85a8')}${m('Lượt xe ra',exits,'#2a85a8')}${m('Chênh lệch nhập – xuất',diff,diff<0?'#c8283a':'#2a85a8')}${m('Chờ sửa chữa',waitingRepair,'#c98a1b')}${m('Chờ giao',waitingGive,'#5b8c4a')}${m('GSM gửi',st[GSM_SENT]||0,'#7a5af8')}${m('Xe mới xuất bãi',newExited,'#2a85a8')}</div></div>
 <div class="rp-panel"><h2>CẢNH BÁO XE TỒN BÃI THEO THỜI GIAN NHẬP</h2><div class="rp-sub">Nhóm 0–10 ngày: ${groups[0].length} xe</div>${ageRows}</div>

 <div class="rp-three">${box('TÌNH TRẠNG XE TRONG BÃI',stRows)}${box('DÒNG XE TRONG BÃI',modelRows)}${box('VỊ TRÍ XE TRONG BÃI',rowRows)}</div>

}
function reportExtraHtml(range,live,age,ctx){
 const bars=(title,rows,color)=>{rows=rows.filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...rows.map(r=>r[1]));return `<div class="reportbox rx-box"><h2>${title}</h2>${rows.map(([k,n])=>`<div class="rx-row"><span>${esc(k||'(Chưa ghi)')}</span><div class="rx-track"><i style="width:${n/mx*100}%;background:${color||'#1684c9'}"></i></div><b>${n}</b></div>`).join('')||'<div class="muted">Không có dữ liệu.</div>'}</div>`};

 const days=age.map(x=>x.days).filter(x=>x!==null);

 const lastC=v=>(v.cycles||[]).slice(-1)[0]||{};

 const kpi=(a,b,c)=>`<div class="rx-kpi"><span>${a}</span><strong>${b}</strong>${c?`<small>${c}</small>`:''}</div>`;
 const d=ctx.entries-ctx.prevEntries,e=ctx.exits-ctx.prevExits,sg=n=>(n>0?'+':'')+n;
 const dailyRows=ctx.daily.map(x=>`<div class="rx-day"><b>${esc(x.label)}</b><span>Vào ${x.in}</span><span>Ra ${x.out}</span><em>Tồn ${x.stock}</em></div>`).join('');
 return `<div class="rp-sec">PHÂN TÍCH BỔ SUNG</div><div class="rx-kpis">${kpi('SỐ NGÀY TỒN TB',avg+' ngày','Cao nhất: '+mxAge+' ngày')}${kpi('Ô ĐÃ ĐỖ / TRỐNG',occupied+' / '+Math.max(0,400-occupied),'Lấp đầy '+(occupied/4).toFixed(1)+'%')}${kpi('XE CHỜ GÁN VỊ TRÍ',wait,'Chưa có ô đỗ')}${kpi('XE NHẬP LẠI (≥2 CHU KỲ)',reentry,'Đang ở bãi')}</div>
 <div class="rx-kpis">${kpi('LƯỢT VÀO SO KỲ TRƯỚC',ctx.entries,sg(d)+' so với '+ctx.prevEntries)}${kpi('LƯỢT RA SO KỲ TRƯỚC',ctx.exits,sg(e)+' so với '+ctx.prevExits)}${kpi('VÀO − RA TRONG KỲ',sg(ctx.entries-ctx.exits),'Chênh lệch ròng')}${kpi('THỜI GIAN 1 VÒNG TB',ctx.avgCycle+' ngày','Xe xuất trong kỳ · '+ctx.sameDay+' xe vào/ra cùng ngày')}</div>
 <div class="rx-grid">

function reportExtraCtx(range){
 const fromT=range.from.getTime(),toT=range.to.getTime()+86400000-1,len=Math.round((range.to-range.from)/86400000)+1;
 const pFrom=new Date(range.from);pFrom.setDate(pFrom.getDate()-len);const pTo=new Date(range.from);pTo.setDate(pTo.getDate()-1);
 const inR=(c,k,a,b)=>{const d=parseDateValue(c[k]);return d&&d.getTime()>=a&&d.getTime()<=b};
 let entries=0,exits=0,prevEntries=0,prevExits=0,inOld=0,inNew=0,sameDay=0;const cyc=[],inCond={},outR={};
 state.vehicles.forEach(v=>(v.cycles||[]).forEach(c=>{
  if(inR(c,'entryDate',fromT,toT)){entries++;if(vehicleTypeOf(v)==='Xe cũ')inOld++;else inNew++;const k=canonStatus(c.entryCondition)||'Chưa ghi tình trạng';inCond[k]=(inCond[k]||0)+1}
  if(inR(c,'exitDate',fromT,toT)){exits++;const k=c.exitReason||'(Chưa ghi)';outR[k]=(outR[k]||0)+1;const a=parseDateValue(c.entryDate),b=parseDateValue(c.exitDate);if(a&&b){cyc.push(Math.round((b-a)/86400000));if(+a===+b)sameDay++}}
  if(inR(c,'entryDate',pFrom.getTime(),pTo.getTime()+86400000-1))prevEntries++;
  if(inR(c,'exitDate',pFrom.getTime(),pTo.getTime()+86400000-1))prevExits++;
 }));
 const daily=[];for(let i=0;i<len&&i<62;i++){const d=new Date(range.from);d.setDate(d.getDate()+i);const t0=d.getTime(),t1=t0+86400000-1;let a=0,b=0;state.vehicles.forEach(v=>(v.cycles||[]).forEach(c=>{if(inR(c,'entryDate',t0,t1))a++;if(inR(c,'exitDate',t0,t1))b++}));daily.push({label:String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'),in:a,out:b,stock:reportSnapshot(d).length})}
 return {entries,exits,prevEntries,prevExits,inOld,inNew,sameDay,avgCycle:cyc.length?(cyc.reduce((a,b)=>a+b,0)/cyc.length).toFixed(1):'0',inCond:Object.entries(inCond),outReason:Object.entries(outR),daily};
}
