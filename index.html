.overlay{position:fixed;inset:0;background:#0b1b2c88;z-index:80;display:none;align-items:flex-end;justify-content:center;padding:10px}.overlay.show{display:flex}.modal{background:white;width:min(620px,100%);max-height:92dvh;overflow:auto;border-radius:20px 20px 14px 14px;padding:17px;box-shadow:0 20px 70px #0003}.modal.wide{width:min(950px,100%)}.modal h3{font-size:18px;font-weight:900;margin:0 0 13px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:750;color:#475569;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;background:white;min-width:0}.field textarea{min-height:70px}.rowselect{display:flex;gap:5px}.rowselect select{flex:1}.rowselect button{flex:0 0 36px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.actions>*{flex:1}.notice{font-size:12px;padding:9px;border-radius:9px;margin-top:8px}.danger{background:#fff0f0;color:#b42318}.muted{color:var(--muted)}.toastbox{position:fixed;top:12px;left:50%;transform:translate(-50%,-130%);z-index:120;transition:transform .25s ease;width:min(92vw,440px);padding:12px 15px;border-radius:12px;color:white;font-weight:750;box-shadow:0 8px 25px #0002}.toastbox.show{transform:translate(-50%,0)}.toastbox.success{background:#15803d}.toastbox.error{background:#b42318}.toastbox.warn{background:#b7791f}.fab{position:fixed;right:20px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:32px;box-shadow:0 8px 25px #0066cc55;z-index:40;cursor:pointer}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #e5edf5;text-align:left;white-space:nowrap}th{background:#edf6ff;color:#174477}.report{width:1080px;background:#f5f8fc;padding:28px;color:#172b45}.report h1{font-size:27px;font-weight:900;color:#075 .trend-bars{height:137px;display:flex;align-items:flex-end;gap:8px}.trend-bar{width:10px;min-height:2px;border-radius:7px 7px 0 0;position:relative}.trend-bar.old{background:#1684c9}.trend-bar.new{background:#16a56d}.trend-val{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;color:#34465e}.trend-day small{font-size:10px;color:#8493a8;margin-top:10px}.trend-legend{font-size:12px;color:#70839d;padding-top:12px}.trend-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 5px 0 0}.report-metrics{padding:0}.metric-row{height:49px;border-bottom:1px solid #e0e7ef;display:flex;align-items:center;justify-content:space-between;font-size:14px}.metric-row b{color:#263b55}.report-age{margin-bottom:13px}.age-row{display:grid;grid-template-columns:112px 1fr 34px;gap:10px;align-items:center;margin:13px 0;font-size:13px}.age-track{height:14px;background:#edf1f5;border-radius:10px;overflow:hidden}.age-fill{height:100%;border-radius:10px}.report-special{margin-bottom:0}.special-content{min-height:65px;border:1px solid #dce5ef;border-radius:12px;padding:14px;font-size:14px;line-height:1.55;color:#263b55;white-space:normal}.report-foot{font-size:10px;color:#8494aa;margin-top:18px}.report-preview-title{font-size:11px;font-weight:850;color:#64748b;margin:18px 0 7px}.report-preview-window{max-height:45dvh;overflow:auto;border:1px solid #dbe5ef;border-radius:12px;background:#f4f7fb;padding:8px}.report-preview-window .report{zoom:.62}.report-preview-window .report-special{margin-top:13px}.hidden{display:none!important}
@media(min-width:800px){.wrap{display:flex;align-items:center;gap:22px}.toolbar{flex:1;margin:0}.brand{min-width:170px}.overlay{align-items:center}.modal{border-radius:18px}.yardgrid{gap:7px}.slot{min-height:55px}.slot b,.slot span{font-size:11px}}
@media(max-width:560px){.wrap{padding:9px}.brand{font-size:15px}.brand svg{width:35px}.toolbar{grid-template-columns:1fr;gap:7px}.tools{display:grid;grid-template-columns:1fr 1fr 42px}.tools .btn{padding:8px 5px;font-size:11px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi strong{font-size:22px}main{padding:10px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.slot{min-height:43px}.fab{right:15px;bottom:17px}}

<script>
'use strict';
const DB_KEY='BX34_DB', URL_KEY='GAS_WEB_APP_URL', MAX_CYCLES=10;
const DEFAULT_CATALOGS={
 models:['VF 3','VF 5','VF e34','VF 6','VF 7','VF 8','VF 9','Minio Green','Herio Green','Limo Green','EC Van'],
 colors:['Trắng','Đen','Bạc','Xám','Đỏ','Xanh dương','Xanh lá','Vàng','Cam'],
 staffDepts:['Thông/Kho','Điều phối','Kỹ thuật','PKD'],
 reasons:['Giao khách','Về xưởng','Giao GSM','Điều chuyển','Khác']
};
let state=loadState(), activeVehicleId=null, toastTimer=null, syncing=false, syncTimer=null, pollTimer=null, serverRevision=localStorage.getItem('BX34_SERVER_REVISION')||'', syncReady=false, localDirty=false;
let openRows=new Set();
function loadState(){try{const x=JSON.parse(localStorage.getItem(DB_KEY)||'{}');return {vehicles:Array.isArray(x.vehicles)?x.vehicles:[],catalogs:{...DEFAULT_CATALOGS,...(x.catalogs||{})}}}catch(e){return {vehicles:[],catalogs:structuredCloneSafe(DEFAULT_CATALOGS)}}}
function structuredCloneSafe(x){return JSON.parse(JSON.stringify(x))}
function saveState(){localStorage.setItem(DB_KEY,JSON.stringify(state));localDirty=true;scheduleSync()}
function todayISO(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function fmtDate(x){if(!x)return 'Chưa có ngày nhập';let d;if(/^\d{4}-\d\d-\d\d$/.test(String(x)))d=new Date(x+'T00:00:00');else{const m=String(x).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);d=m?new Date(+m[3],+m[2]-1,+m[1]):new Date(x)}return isNaN(d)?'Chưa có ngày nhập':new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'}).format(d)}
function ageDays(x){if(!x)return null;let d;if(/^\d{4}-\d\d-\d\d$/.test(String(x)))d=new Date(x+'T00:00:00');else{const m=String(x).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);d=m?new Date(+m[3],+m[2]-1,+m[1]):new Date(x)}if(isNaN(d))return null;const now=new Date(todayISO()+'T00:00:00');return Math.max(0,Math.floor((now-d)/86400000))}
function normId(x){return String(x||'').toUpperCase().replace(/[.\-\s]/g,'').trim()}
function inYard(v){const status=String(v.status||v.currentStatus||'').toLowerCase();if(['đang trong bãi','trong bãi','in_yard','inside','đang tồn'].includes(status))return true;if(status==='đã xuất bãi'||status==='exited'||status==='out')return false;const c=currentCycle(v);return !!(v.cycles?.length)&&!(c.exitDate||c.dateOut||c.ngayXuat)}
function currentCycle(v){return (v.cycles||[]).slice(-1)[0]||{}}
function vehicleTypeOf(v){return v.vehicleType||v.type||''}
function entryDate(v){const c=currentCycle(v);return c.entryDate||c.dateIn||v.entryDate||''}
function initialEntryDate(v){if(v.missingInitialEntryDate===true)return '';const first=(v.cycles||[])[0]||{};return first.entryDate||first.dateIn||v.initialEntryDate||v.entryDate||''}
function position(v){return v.position||v.currentPosition||v.slot||'Chờ gán vị trí'}
function showToast(msg,type='success'){const el=document.getElementById('toast');el.textContent=msg;el.className='toastbox '+type+' show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500)}
function setSync(status,msg){const dot=document.getElementById('syncdot');dot.className='syncdot '+status;dot.title=msg||status}
function openModal(html,wide=false){const m=document.getElementById('modal');m.className='modal'+(wide?' wide':'');m.innerHTML=html;document.getElementById('overlay').classList.add('show')}
function closeModal(){document.getElementById('overlay').classList.remove('show')}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function liveVehicles(){return state.vehicles.filter(inYard)}
function captureYardView(){const root=document.getElementById('yard');if(root){[...root.querySelectorAll(':scope > .panel')].forEach((panel,i)=>{if(!panel.classList.contains('collapsed'))openRows.add(i+1);else openRows.delete(i+1)})}return {scrollY:window.scrollY,rows:new Set(openRows)}}
function render(){
 const view=captureYardView();
 const live=liveVehicles(), old=live.filter(v=>vehicleTypeOf(v)==='Xe cũ').length, nw=live.length-old, wait=live.filter(v=>!position(v)||position(v)==='Chờ gán vị trí').length;
 document.getElementById('kpiTotal').textContent=live.length;document.getElementById('kpiOld').textContent=old;document.getElementById('kpiNew').textContent=nw;document.getElementById('kpiWait').textContent=wait;
 document.getElementById('waitSummary').textContent=wait+' xe đang chờ · '+old+' xe cũ · '+nw+' xe mới';
 document.getElementById('waitList').innerHTML=live.filter(v=>!position(v)||position(v)==='Chờ gán vị trí').map(v=>`<button class="vehicle-chip" data-detail="${esc(v.id)}">${esc(v.id)} · ${esc(v.model||'Chưa rõ dòng xe')}</button>`).join('')||'<span class="muted text-sm">Không có xe chờ gán.</span>';
 renderYard(view);renderInventory();
}
function slotCodes(){const a=[];for(let r=1;r<=20;r++)for(const p of ['T','TLD','PLD','P'])a.push(p+'-'+String(r).padStart(2,'0'));return a}
function renderYard(view=null){
 const snapshot=view||captureYardView(),root=document.getElementById('yard');root.innerHTML='';
 for(let d=1;d<=5;d++){
  const codes=slotCodes().map(s=>d+s), count=liveVehicles().filter(v=>position(v)!=='Chờ gán vị trí'&&position(v).startsWith(d)).length, free=80-count;
  const panel=document.createElement('section');panel.className='panel'+(snapshot.rows.has(d)?'':' collapsed');panel.dataset.row=d;panel.innerHTML=`<div class="panelhead"><div><h2>▦ Dãy ${d}</h2><div class="summary">${count}/80 vị trí có xe · ${free} chỗ trống</div></div><span>⌄</span></div><div class="panelbody"><div class="yardgrid">${codes.map(code=>{const v=liveVehicles().find(x=>position(x)===code);const cls=!v?'empty':vehicleTypeOf(v)==='Xe cũ'?'old':'new';return `<button class="slot ${cls}" data-slot="${code}"><b>${code}</b><span>${v?esc(v.id):'Trống'}</span></button>`}).join('')}</div></div>`;
  panel.querySelector('.panelhead').onclick=()=>{panel.classList.toggle('collapsed');if(panel.classList.contains('collapsed'))openRows.delete(d);else openRows.add(d)};root.appendChild(panel);
 }
 openRows=new Set(snapshot.rows);requestAnimationFrame(()=>window.scrollTo(0,snapshot.scrollY));
}
function renderInventory(){document.getElementById('inventory').innerHTML=liveVehicles().map(v=>`<tr><td><b>${esc(v.id)}</b></td><td>${esc(vehicleTypeOf(v))}</td><td>${esc(v.model||'')}</td><td>${esc(position(v))}</td><td>${esc(fmtDate(entryDate(v)))}</td><td><button class="btn small" data-detail="${esc(v.id)}">Chi tiết</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Bãi hiện chưa có xe.</td></tr>'}
document.addEventListener('click',e=>{const d=e.target.closest('[data-detail]');if(d){showVehicle(d.dataset.detail);return}const s=e.target.closest('[data-slot]');if(s)slotAction(s.dataset.slot)});
function showVehicle(id){const v=state.vehicles.find(x=>normId(x.id)===normId(id));if(!v)return;activeVehicleId=v.id;const c=currentCycle(v);openModal(`<h3>Hồ sơ xe ${esc(v.id)}</h3><div class="grid grid-cols-2 gap-2 text-sm"><div>Loại xe: <b>${esc(vehicleTypeOf(v))}</b></div><div>Dòng xe: <b>${esc(v.model||'')}</b></div><div>Màu: <b>${esc(v.color||'')}</b></div><div>Vị trí: <b>${esc(position(v))}</b></div><div>Ngày nhập: <b>${esc(fmtDate(entryDate(v)))}</b></div><div>Trạng thái: <b>${esc(v.status||'')}</b></div></div><div class="mt-3 text-sm font-bold">Lịch sử (${(v.cycles||[]).length}/10 chu kỳ)</div><div class="mt-2 space-y-2">${(v.cycles||[]).map((x,i)=>`<div class="p-2 rounded-lg bg-slate-50 text-xs">Chu kỳ ${i+1}: Vào ${esc(fmtDate(x.entryDate))} · Ra ${esc(fmtDate(x.exitDate))} · ${esc(x.exitReason||'')}</div>`).join('')}</div><div class="actions"><button class="btn primary" id="detailExit">Xuất xe</button><button class="btn" id="detailEdit">Sửa thông tin</button><button class="btn" id="detailKick">Kích xe ra ô</button><button class="btn red" id="detailDelete">Xóa hồ sơ</button></div><div class="actions"><button class="btn gray" id="detailClose">Đóng</button></div>`);
 document.getElementById('detailClose').onclick=closeModal;document.getElementById('detailExit').onclick=()=>openExit(v.id);document.getElementById('detailEdit').onclick=()=>openEntry(v.id,true);document.getElementById('detailKick').onclick=()=>kickVehicle(v.id);document.getElementById('detailDelete').onclick=()=>confirmDelete(v.id)}
function options(list,current){return '<option value="">-- Không chọn --</option>'+list.map(x=>`<option ${x===current?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}
function catalogField(label,key,id){return `<div class="field"><label>${label}</label><div class="rowselect"><select id="${id}">${options(state.catalogs[key]||[])}</select><button class="btn small" data-catadd="${key}" type="button">+</button><button class="btn small red" data-catdel="${key}" type="button">🗑</button></div></div>`}
document.addEventListener('click',e=>{const a=e.target.closest('[data-catadd]');if(a)catalogAdd(a.dataset.catadd);const d=e.target.closest('[data-catdel]');if(d)catalogDelete(d.dataset.catdel)});
function catalogAdd(key){openModal(`<h3>Thêm danh mục</h3><div class="field"><label>Giá trị mới</label><input id="catValue" maxlength="80"></div><div class="actions"><button class="btn primary" id="catSave">Lưu</button><button class="btn gray" onclick="closeModal()">Hủy</button></div>`);document.getElementById('catSave').onclick=()=>{const x=document.getElementById('catValue').value.trim();if(!x)return showToast('Vui lòng nhập nội dung','warn');if(!state.catalogs[key].includes(x))state.catalogs[key].push(x);saveState();closeModal();render();showToast('Đã thêm danh mục')}}
function catalogDelete(key){const sel=document.querySelector(`select[id$="${key}"]`)||document.querySelector('.modal select');const val=sel?.value;if(!val)return showToast('Chọn danh mục cần xóa','warn');openModal(`<h3>Xóa danh mục?</h3><p>Bạn có chắc muốn xóa “${esc(val)}” khỏi danh mục?</p><div class="actions"><button class="btn red" id="catDelYes">Xóa</button><button class="btn gray" onclick="closeModal()">Hủy</button></div>`);document.getElementById('catDelYes').onclick=()=>{state.catalogs[key]=state.catalogs[key].filter(x=>x!==val);saveState();closeModal();render();showToast('Đã xóa danh mục')}}
function openEntry(id='',edit=false,forcedPosition=''){
 const v=edit?state.vehicles.find(x=>normId(x.id)===normId(id)):null,c=v?currentCycle(v):{};
 openModal(`<h3>${edit?'Sửa hồ sơ xe':'Nhập xe vào bãi'}</h3><div class="formgrid">
 <div class="field"><label>Loại xe</label><select id="fType"><option ${v?.vehicleType==='Xe mới'?'selected':''}>Xe mới</option><option ${v?.vehicleType==='Xe cũ'?'selected':''}>Xe cũ</option></select></div>
 <div class="field"><label>Biển số / 6 số cuối VIN</label><input id="fId" value="${esc(v?.id||'')}" ${edit?'readonly':''} placeholder="Nhập mã xe"></div>
 <div class="field">${catalogField('Dòng xe','models','fModel')}</div>
 <div class="field">${catalogField('Màu xe','colors','fColor')}</div>
 <div class="field">${catalogField('Tên / Bộ phận','staffDepts','fStaff')}</div>
 <div class="field"><label>Ngày nhập</label><input type="date" id="fDate" value="${esc(c.entryDate||todayISO())}"><label class="mt-2"><input type="checkbox" id="fMissing" ${v?.missingInitialEntryDate?'checked':''}> Chưa có ngày nhập</label></div>
 <div class="field full"><label>Vị trí đỗ (để trống nếu chưa gán)</label><select id="fPosition"><option value="">Chờ gán vị trí</option>${allFreeSlots(v?.position).map(x=>`<option ${x===(forcedPosition||v?.position)?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field full"><label>Ghi chú</label><textarea id="fNote">${esc(c.note||v?.note||'')}</textarea></div>
 </div><div id="duplicateWarning"></div><div id="returningNotice" class="notice" style="display:none;background:#eaf7ef;color:#087344"></div><div class="actions"><button class="btn primary" id="saveEntry">${edit?'Lưu thay đổi':'Lưu nhập xe'}</button><button class="btn gray" onclick="closeModal()">Hủy</button></div>`);
 if(v){document.getElementById('fModel').value=v.model||'';document.getElementById('fColor').value=v.color||'';document.getElementById('fStaff').value=c.entryStaff||''}
 const idInput=document.getElementById('fId'), save=document.getElementById('saveEntry');
 function checkDuplicate(){const key=normId(idInput.value);const dup=state.vehicles.find(x=>normId(x.id)===key&&inYard(x)&&(!edit||normId(x.id)!==normId(v.id)));const warn=document.getElementById('duplicateWarning'),notice=document.getElementById('returningNotice');if(dup){warn.innerHTML=`<div class="notice danger">Mã xe đang tồn tại tại vị trí: ${esc(position(dup))}. Không thể nhập trùng.</div>`;save.disabled=true;save.style.opacity='.45';notice.style.display='none'}else{warn.innerHTML='';save.disabled=false;save.style.opacity='1';const prior=!edit&&key?state.vehicles.find(x=>normId(x.id)===key&&!inYard(x)):null;if(prior){const cycles=prior.cycles||[];if(cycles.length>=MAX_CYCLES){notice.textContent='Hồ sơ đã đủ 10 chu kỳ Vào/Ra, không thể nhập thêm.';notice.style.display='block';save.disabled=true;save.style.opacity='.45';return;}if(prior.model){const sel=document.getElementById('fModel');if(![...sel.options].some(o=>o.value===prior.model))sel.add(new Option(prior.model,prior.model));sel.value=prior.model}if(prior.color){const sel=document.getElementById('fColor');if(![...sel.options].some(o=>o.value===prior.color))sel.add(new Option(prior.color,prior.color));sel.value=prior.color}notice.textContent=`🔄 Xe quay lại bãi (Chu kỳ thứ ${cycles.length+1}) – Đã tự động điền dòng xe`;notice.style.display='block'}else{notice.style.display='none'}}}
 idInput.addEventListener('input',checkDuplicate);checkDuplicate();
 save.onclick=()=>{const raw=idInput.value.trim(),type=document.getElementById('fType').value;const clean=type==='Xe cũ'?normId(raw):raw.replace(/\D/g,'').slice(-6);if(!clean)return showToast(type==='Xe cũ'?'Cần nhập biển số':'Cần nhập 6 số cuối VIN','error');if(type==='Xe mới'&&!/^\d{6}$/.test(clean))return showToast('VIN phải có đúng 6 chữ số cuối','error');const dup=state.vehicles.find(x=>normId(x.id)===normId(clean)&&inYard(x)&&(!edit||normId(x.id)!==normId(v.id)));if(dup)return showToast('Xe đang tồn tại: '+position(dup),'error');
 const date=document.getElementById('fMissing').checked?'':document.getElementById('fDate').value;const pos=document.getElementById('fPosition').value;let target=v;
 if(edit){target.model=document.getElementById('fModel').value;target.color=document.getElementById('fColor').value;target.position=pos;target.note=document.getElementById('fNote').value;target.vehicleType=type;target.updatedAt=new Date().toISOString();if(c && !c.entryDate)c.entryDate=date;const first=(target.cycles||[])[0]||{};target.missingInitialEntryDate=!(first.entryDate||first.dateIn||target.initialEntryDate||target.entryDate)}
 else{target=state.vehicles.find(x=>normId(x.id)===normId(clean));if(!target)target={id:clean,cycles:[],vehicleType:type};if(!target.cycles)target.cycles=[];if(target.cycles.length>=MAX_CYCLES)target.cycles=target.cycles.slice(-(MAX_CYCLES-1));target.cycles.push({entryDate:date,entryStaff:document.getElementById('fStaff').value,entryAt:new Date().toISOString(),note:document.getElementById('fNote').value});target.status='Đang trong bãi';target.vehicleType=type;target.model=document.getElementById('fModel').value;target.color=document.getElementById('fColor').value;target.position=pos||'';const first=(target.cycles||[])[0]||{};target.missingInitialEntryDate=!(first.entryDate||first.dateIn||target.initialEntryDate||target.entryDate);target.updatedAt=new Date().toISOString();if(!state.vehicles.some(x=>normId(x.id)===normId(clean)))state.vehicles.push(target)}
 saveState();closeModal();render();showToast(edit?'Đã cập nhật hồ sơ':'Đã nhập xe thành công')};
}
function allFreeSlots(allow=''){const used=new Set(liveVehicles().filter(v=>v.position&&v.position!==allow).map(v=>v.position));const out=[];for(let d=1;d<=5;d++)for(let r=1;r<=20;r++)for(const p of ['T','TLD','PLD','P']){const x=d+p+'-'+String(r).padStart(2,'0');if(!used.has(x))out.push(x)}return out}
function openExit(id){const v=state.vehicles.find(x=>normId(x.id)===normId(id));if(!v||!inYard(v)||!(v.cycles||[]).length)return showToast('Không thể xuất: xe chưa nhập hoặc đã xuất bãi','error');const c=currentCycle(v);openModal(`<h3>Xuất xe khỏi bãi</h3><div class="p-3 rounded-xl bg-slate-50 text-sm mb-3"><b>${esc(v.id)}</b> · ${esc(v.model||'')} · ${esc(v.color||'')}<br>Vị trí: ${esc(position(v))}</div><div class="formgrid"><div class="field">${catalogField('Tên / Bộ phận','staffDepts','xStaff')}</div><div class="field">${catalogField('Lý do xuất','reasons','xReason')}</div><div class="field full"><label>Ngày xuất</label><input type="date" id="xDate" value="${todayISO()}"></div><div class="field full"><label>Ghi chú</label><textarea id="xNote"></textarea></div></div><div class="actions"><button class="btn primary" id="doExit">Xác nhận xuất xe</button><button class="btn gray" onclick="closeModal()">Hủy</button></div>`);document.getElementById('doExit').onclick=()=>{const cycle=currentCycle(v);cycle.exitDate=document.getElementById('xDate').value;cycle.exitStaff=document.getElementById('xStaff').value;cycle.exitReason=document.getElementById('xReason').value;cycle.exitNote=document.getElementById('xNote').value;cycle.exitAt=new Date().toISOString();v.status='Đã xuất bãi';v.position='';v.updatedAt=new Date().toISOString();saveState();closeModal();render();showToast('Đã xuất xe, vị trí được giải phóng')}}
function kickVehicle(id){const v=state.vehicles.find(x=>normId(x.id)===normId(id));if(!v)return;openModal(`<h3>Kích xe ra khỏi vị trí?</h3><p>Xe ${esc(v.id)} sẽ chuyển về danh sách chờ gán, vẫn được tính tồn bãi.</p><div class="actions"><button class="btn primary" id="kickYes">Xác nhận</button><button class="btn gray" onclick="closeModal()">Hủy</button></div>`);document.getElementById('kickYes').onclick=()=>{v.position='';v.updatedAt=new Date().toISOString();saveState();closeModal();render();showToast('Xe đã chuyển về danh sách chờ')}}
function confirmDelete(id){openModal(`<h3>Xóa hồ sơ xe?</h3><p>Toàn bộ hồ sơ và lịch sử tối đa 10 chu kỳ của xe <b>${esc(id)}</b> sẽ bị xóa.</p><div class="actions"><button class="btn red" id="deleteYes">Xóa vĩnh viễn</button><button class="btn gray" onclick="closeModal()">Hủy</button></div>`);document.getElementById('deleteYes').onclick=()=>{state.vehicles=state.vehicles.filter(x=>normId(x.id)!==normId(id));saveState();closeModal();render();showToast('Đã xóa hồ sơ xe')}}
function slotAction(code){
 const occupied=liveVehicles().find(x=>position(x)===code);if(occupied){showVehicle(occupied.id);return}
 const waiting=liveVehicles().filter(x=>!x.position||x.position==='Chờ gán vị trí');
 openModal(`<h3>Chọn thao tác cho ô ${esc(code)}</h3><p class="text-sm muted mb-3">Ô đang trống · Chọn xe để chuyển vào vị trí này hoặc nhập hồ sơ mới</p><div class="field"><label>Tìm nhanh biển số / 6 số VIN</label><input id="slotQuickSearch" placeholder="Gõ ít nhất 2 ký tự..." autocomplete="off"></div><div id="slotSearchResults" class="mt-2" style="max-height:190px;overflow:auto"></div><div class="actions"><button class="btn primary" id="slotNew">＋ Nhập xe mới vào ô này</button></div><div class="mt-4"><b class="text-sm">Xe đang chờ gán vị trí (${waiting.length})</b><div id="slotWaitingList" class="mt-2" style="max-height:230px;overflow:auto">${waiting.map(x=>`<button class="vehicle-chip block w-full text-left my-1" data-slot-pick="${esc(x.id)}">${esc(x.id)} · ${esc(x.model||'Chưa rõ dòng xe')}</button>`).join('')||'<div class="muted text-sm py-2">Không có xe chờ gán.</div>'}</div></div><div class="actions"><button class="btn gray" onclick="closeModal()">Đóng</button></div>`);
 const assign=id=>{const x=state.vehicles.find(v=>normId(v.id)===normId(id));if(!x)return;if(inYard(x)){x.position=code}else{const cycles=x.cycles||[];if(cycles.length>=MAX_CYCLES)return showToast('Hồ sơ đã đủ 10 chu kỳ, không thể nhập thêm','error');cycles.push({entryDate:todayISO(),entryAt:new Date().toISOString(),note:'Xe quay lại bãi từ thao tác gán ô'});x.cycles=cycles;x.status='Đang trong bãi';x.position=code}x.updatedAt=new Date().toISOString();saveState();closeModal();render();showToast('Đã xếp xe '+id+' vào '+code)};
 document.getElementById('slotNew').onclick=()=>openEntry('',false,code);
 document.getElementById('slotQuickSearch').addEventListener('input',e=>{const q=normId(e.target.value),box=document.getElementById('slotSearchResults');if(q.length<2){box.innerHTML='<div class="muted text-xs py-2">Nhập từ 2 ký tự để tìm xe trong toàn bộ hồ sơ.</div>';return}const found=state.vehicles.filter(x=>normId(x.id).includes(q)).slice(0,15);box.innerHTML=found.map(x=>`<button class="vehicle-chip block w-full text-left my-1" data-slot-pick="${esc(x.id)}">${esc(x.id)} · ${esc(x.model||'Chưa rõ dòng xe')} · ${esc(inYard(x)?(position(x)||'Chờ gán'):'Đã xuất bãi')}</button>`).join('')||'<div class="muted text-sm py-2">Không tìm thấy hồ sơ phù hợp.</div>'});
 document.getElementById('slotWaitingList').addEventListener('click',e=>{const b=e.target.closest('[data-slot-pick]');if(b)assign(b.dataset.slotPick)});
}
document.getElementById('fab').onclick=()=>openEntry();
document.getElementById('search').addEventListener('input',e=>{const q=normId(e.target.value),box=document.getElementById('suggestions');if(q.length<2){box.classList.add('hidden');return}const found=state.vehicles.filter(v=>normId(v.id).includes(q)).slice(0,12);box.innerHTML=found.map(v=>`<div class="suggestion" data-detail="${esc(v.id)}"><b>${esc(v.id)}</b><div class="text-xs muted">${esc(v.model||'')} · ${esc(inYard(v)?position(v):'Đã xuất bãi')}</div></div>`).join('')||'<div class="suggestion muted">Không tìm thấy xe</div>';box.classList.remove('hidden')});
document.addEventListener('click',e=>{if(!e.target.closest('#search')&&!e.target.closest('#suggestions'))document.getElementById('suggestions').classList.add('hidden')});
document.getElementById('waitPanel').querySelector('.panelhead').onclick=()=>document.getElementById('waitPanel').classList.toggle('collapsed');

function exportExcel(){const rows=liveVehicles().map(v=>({ViTriDo:position(v),LoaiXe:v.vehicleType,MaXe_ID:v.id,DongXe:v.model,MauXe:v.color,NgayNhap:fmtDate(entryDate(v)),SoNgayTon:ageDays(entryDate(v))===null?'>31':ageDays(entryDate(v)),TenBoPhan:currentCycle(v).entryStaff||'',GhiChu:currentCycle(v).note||v.note||''}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'TonBai');XLSX.writeFile(wb,'BAI_XE_34_TON_BAI.xlsx')}
document.getElementById('excelBtn').onclick=exportExcel;
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});downloadBlob(blob,'BAI_XE_34_BACKUP.json')}
function downloadBlob(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importBackup(file){const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!Array.isArray(x.vehicles))throw Error('File không có mảng vehicles');const imported={vehicles:x.vehicles,catalogs:{...DEFAULT_CATALOGS,...(x.catalogs||{})}};if(!imported.vehicles.length)throw Error('Mảng vehicles đang rỗng');if(imported.vehicles.some(v=>!v||!v.id||!Array.isArray(v.cycles)))throw Error('Có hồ sơ thiếu ID hoặc mảng cycles');state=imported;localStorage.setItem(DB_KEY,JSON.stringify(state));clearTimeout(syncTimer);render();showToast('Đã nhập '+state.vehicles.length+' hồ sơ xe. Hãy bấm Đẩy toàn bộ lên Sheet để đồng bộ.')}catch(e){showToast('File JSON không hợp lệ: '+e.message,'error')}};reader.readAsText(file)}
function importExcel(file){const reader=new FileReader();reader.onload=()=>{try{const wb=XLSX.read(reader.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws);rows.forEach(r=>{const id=String(r.MaXe_ID||r.BienSo||r.VIN||'').trim();if(!id)return;let v=state.vehicles.find(x=>normId(x.id)===normId(id));if(!v){v={id,cycles:[],vehicleType:r.LoaiXe||'',model:r.DongXe||'',color:r.MauXe||'',position:r.ViTriDo||''};state.vehicles.push(v)}const d=r.NgayNhap||r.entryDate||'';if(!v.cycles.length)v.cycles.push({entryDate:d,entryStaff:r.TenBoPhan||'',note:r.GhiChu||''});const first=(v.cycles||[])[0]||{};v.missingInitialEntryDate=!(first.entryDate||first.dateIn||v.initialEntryDate||v.entryDate);v.status='Đang trong bãi';if(r.ViTriDo)v.position=r.ViTriDo});saveState();render();showToast('Đã nhập dữ liệu Excel; ngày nhập lấy từ file nguồn')}catch(e){showToast('Không đọc được Excel: '+e.message,'error')}};reader.readAsArrayBuffer(file)}
function openSettings(){openModal(`<h3>⚙️ Cài đặt hệ thống</h3><div class="field"><label>URL Google Apps Script Web App</label><input id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(localStorage.getItem(URL_KEY)||'')}"></div><div class="actions"><button class="btn primary" id="saveTest">Lưu & kiểm tra kết nối</button><button class="btn green" id="pushAll">Đẩy toàn bộ lên Sheet</button><button class="btn" id="pullAll">Tải dữ liệu từ Sheet</button></div><hr class="my-4"><h3 class="text-base">Sao lưu & phục hồi</h3><div class="actions"><button class="btn" id="backupJson">Xuất backup JSON</button><button class="btn" id="backupXlsx">Xuất Excel tổng hợp</button></div><div class="field mt-3"><label>Nhập file JSON hoặc Excel</label><input type="file" id="restoreFile" accept=".json,.xlsx,.xls"></div><hr class="my-4"><h3 class="text-base text-red-700">Khôi phục cài đặt gốc</h3><p class="text-xs muted">Xóa dữ liệu ứng dụng trên trình duyệt hiện tại. Không xóa dữ liệu đã lưu trên Google Sheets.</p><div class="actions"><button class="btn red" id="resetLocal">Xóa dữ liệu trên máy</button><button class="btn gray" onclick="closeModal()">Đóng</button></div>`,false);
 document.getElementById('saveTest').onclick=async()=>{const u=document.getElementById('gasUrl').value.trim();localStorage.setItem(URL_KEY,u);try{const r=await gasGet('ping');if(r.status!=='ok')throw Error(r.message||'Không phản hồi');setSync('ok','Đã kết nối');showToast(r.message||'Kết nối thành công')}catch(e){setSync('err','Lỗi kết nối');showToast('Kết nối thất bại: '+e.message,'error')}};
 document.getElementById('pushAll').onclick=async()=>{await pushToGoogleSheet();};
 document.getElementById('pullAll').onclick=async()=>{try{await pullFromGoogleSheet();closeModal();render()}catch(e){showToast(e.message,'error')}};
 document.getElementById('backupJson').onclick=exportBackup;document.getElementById('backupXlsx').onclick=()=>{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(state.vehicles),'HoSoXe');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(state.catalogs.models.map(x=>({DongXe:x}))), 'DongXe');XLSX.writeFile(wb,'BAI_XE_34_BACKUP.xlsx')};
 document.getElementById('restoreFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.name.toLowerCase().endsWith('.json'))importBackup(f);else importExcel(f)};
 document.getElementById('resetLocal').onclick=()=>{openModal(`<h3>Xác nhận xóa dữ liệu?</h3><p>Toàn bộ dữ liệu trên trình duyệt này sẽ bị xóa vĩnh viễn.</p><div class="actions"><button class="btn red" id="resetYes">Xóa toàn bộ</button><button class="btn gray" onclick="closeModal()">Hủy</button></div>`);document.getElementById('resetYes').onclick=()=>{state={vehicles:[],catalogs:structuredCloneSafe(DEFAULT_CATALOGS)};saveState();closeModal();closeModal();render();showToast('Đã xóa dữ liệu trên thiết bị','warn')}}}
document.getElementById('settingsBtn').onclick=openSettings;
function scheduleSync(){if(!localStorage.getItem(URL_KEY))return;clearTimeout(syncTimer);syncTimer=setTimeout(pushToGoogleSheet,850)}
function gasGet(action){const url=localStorage.getItem(URL_KEY);if(!url)return Promise.reject(Error('Chưa cấu hình URL Web App'));return new Promise((resolve,reject)=>{const cb='__bxcb'+Date.now()+Math.floor(Math.random()*10000),s=document.createElement('script'),t=setTimeout(()=>finish(Error('Hết thời gian chờ')),20000);function finish(err,data){clearTimeout(t);delete window[cb];s.remove();err?reject(err):resolve(data)}window[cb]=d=>finish(null,d);s.onerror=()=>finish(Error('Không truy cập được Apps Script. Kiểm tra URL/Anyone.'));const u=new URL(url);u.searchParams.set('action',action);u.searchParams.set('callback',cb);u.searchParams.set('_',Date.now());s.src=u.toString();document.head.appendChild(s)})}
function verifyRemoteState(remote,local){
 const rv=remote.vehicles||remote.records||[],lv=local.vehicles||[];
 if(rv.length!==lv.length)return false;
 const key=x=>normId(x.id||x.vehicleId||x.MaXe_ID||'');
 const remoteMap=new Map(rv.map(v=>[key(v),v]));
 for(const v of lv){const r=remoteMap.get(key(v));if(!r)return false;
  if((v.cycles||[]).length!==(r.cycles||[]).length)throw Error('Lịch sử chu kỳ chưa khớp tại hồ sơ '+v.id);
  const fields=[['vehicleType',vehicleTypeOf(v),vehicleTypeOf(r)],['model',v.model||'',r.model||''],['color',v.color||'',r.color||''],['position',position(v)==='Chờ gán vị trí'?'':position(v),position(r)==='Chờ gán vị trí'?'':position(r)],['status',v.status||'',r.status||''],['missingInitialEntryDate',!!v.missingInitialEntryDate,!!r.missingInitialEntryDate]];
  const mismatch=fields.find(x=>String(x[1])!==String(x[2]));
  if(mismatch)return false;
  const cycleFields=['entryDate','entryStaff','exitDate','exitStaff','note'];
  for(let i=0;i<(v.cycles||[]).length;i++){
   for(const field of cycleFields){const a=(v.cycles[i]||{})[field]||'',b=(r.cycles[i]||{})[field]||'';if(String(a)!==String(b))return false}
   const aReason=(v.cycles[i]||{}).exitReason||(v.cycles[i]||{}).reason||'',bReason=(r.cycles[i]||{}).exitReason||(r.cycles[i]||{}).reason||'';
   if(String(aReason)!==String(bReason))return false;
  }
 }
 for(const k of ['models','colors','staffDepts','reasons']){
  const a=[...(local.catalogs?.[k]||[])].map(String).sort(),b=[...(remote.catalogs?.[k]||[])].map(String).sort();
  if(JSON.stringify(a)!==JSON.stringify(b))return false;
 }
 return true;
}
async function pushToGoogleSheet(){
 if(syncing)return;
 const url=localStorage.getItem(URL_KEY);
 if(!url){setSync('err','Chưa cấu hình Google Sheets');return}
 if(!syncReady){showToast('Đang xác lập dữ liệu gốc từ Google Sheets. Vui lòng đợi.','warn');return}
 syncing=true;setSync('busy','Đang gửi thay đổi lên Sheet');
 try{
  const payload={action:'syncFull',baseRevision:serverRevision,data:{vehicles:state.vehicles,catalogs:state.catalogs}};
  await fetch(url,{method:'POST',mode:'no-cors',redirect:'follow',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload)});
  const remote=await gasGet('getAll');
  if(remote.status!=='ok')throw Error(remote.message||'Không đọc được Google Sheets');
  if(!verifyRemoteState(remote,state)){
   state={vehicles:remote.vehicles||remote.records||[],catalogs:{...DEFAULT_CATALOGS,...(remote.catalogs||{})}};
   localStorage.setItem(DB_KEY,JSON.stringify(state));serverRevision=remote.revision||'';localStorage.setItem('BX34_SERVER_REVISION',serverRevision);localDirty=false;render();
   setSync('warn','Có xung đột – đã tải bản Sheet');showToast('Sheet đã có thay đổi mới hơn. Đã ưu tiên dữ liệu Google Sheets để tránh ghi đè.','warn');return;
  }
  serverRevision=remote.revision||serverRevision;localStorage.setItem('BX34_SERVER_REVISION',serverRevision);localDirty=false;
  setSync('ok','Hai chiều đã đồng bộ');
 }catch(e){setSync('err','Đồng bộ thất bại');showToast(e.message||'Lỗi đồng bộ Google Sheets','error');console.error(e)}finally{syncing=false}
}
async function pullFromGoogleSheet(silent=false){
 const remote=await gasGet('getAll');if(remote.status!=='ok')throw Error(remote.message||'Lỗi tải dữ liệu');
 state={vehicles:remote.vehicles||remote.records||[],catalogs:{...DEFAULT_CATALOGS,...(remote.catalogs||{})}};
 localStorage.setItem(DB_KEY,JSON.stringify(state));serverRevision=remote.revision||'';localStorage.setItem('BX34_SERVER_REVISION',serverRevision);localDirty=false;syncReady=true;render();setSync('ok','Đã tải dữ liệu mới nhất từ Google Sheets');
 if(!silent)showToast('Đã tải '+state.vehicles.length+' hồ sơ mới nhất từ Google Sheets');
 return remote;
}
async function initializeSync(){
 if(!localStorage.getItem(URL_KEY)){setSync('err','Chưa cấu hình Google Sheets');return}
 try{
  const localCount=state.vehicles.length;
  const remote=await gasGet('getAll');if(remote.status!=='ok')throw Error(remote.message||'Không đọc được Google Sheets');
  const remoteVehicles=remote.vehicles||remote.records||[];
  if(remoteVehicles.length){
   state={vehicles:remoteVehicles,catalogs:{...DEFAULT_CATALOGS,...(remote.catalogs||{})}};
   localStorage.setItem(DB_KEY,JSON.stringify(state));serverRevision=remote.revision||'';localStorage.setItem('BX34_SERVER_REVISION',serverRevision);localDirty=false;
  }else if(localCount){
   serverRevision=remote.revision||'';localStorage.setItem('BX34_SERVER_REVISION',serverRevision);syncReady=true;localDirty=true;await pushToGoogleSheet();
  }else{
   serverRevision=remote.revision||'';localStorage.setItem('BX34_SERVER_REVISION',serverRevision);
  }
  syncReady=true;render();setSync('ok','Đã kết nối hai chiều');
 }catch(e){syncReady=false;setSync('err','Không tải được dữ liệu từ Sheet');showToast('Không thể khởi tạo đồng bộ: '+e.message,'error');console.error(e)}
}
function startSheetPolling(){
 clearInterval(pollTimer);pollTimer=setInterval(async()=>{
  if(document.hidden||syncing||!syncReady||!localStorage.getItem(URL_KEY))return;
  try{
   const remote=await gasGet('getAll');if(remote.status!=='ok')throw Error(remote.message||'Lỗi kiểm tra Sheet');
   if(remote.revision&&remote.revision!==serverRevision){
    if(localDirty){
     setSync('warn','Sheet có thay đổi – đang xử lý xung đột');
     // Server revision guard prevents stale local data from overwriting the Sheet.
     await pushToGoogleSheet();
    }else{
     state={vehicles:remote.vehicles||remote.records||[],catalogs:{...DEFAULT_CATALOGS,...(remote.catalogs||{})}};
     localStorage.setItem(DB_KEY,JSON.stringify(state));serverRevision=remote.revision;localStorage.setItem('BX34_SERVER_REVISION',serverRevision);render();
     setSync('ok','Đã nhận thay đổi từ Google Sheets');showToast('Google Sheets vừa thay đổi. HTML đã cập nhật dữ liệu mới.','success');
    }
   }
  }catch(e){setSync('err','Mất kết nối Google Sheets');console.warn(e)}
 },30000);
}
function parseDateValue(x){
 if(!x)return null;
 if(/^\d{4}-\d\d-\d\d$/.test(String(x)))return new Date(String(x)+'T00:00:00');
 const m=String(x).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
 const d=m?new Date(+m[3],+m[2]-1,+m[1]):new Date(x);
 return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateLabel(d){return new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}
function reportAgeDate(v){
 const first=(v.cycles||[])[0]||{};
 const original=first.entryDate||first.dateIn||v.initialEntryDate||v.entryDate||'';
 if(v.missingInitialEntryDate===true||(!original&&v.cycles&&v.cycles.length&&!(first.entryDate||first.dateIn)))return '';
 return entryDate(v)||original||'';
}
function reportAgeDays(value,asOf){
 const d=parseDateValue(value);if(!d)return null;
 return Math.max(0,Math.floor((new Date(asOf.getFullYear(),asOf.getMonth(),asOf.getDate())-d)/86400000));
}
function reportSnapshot(day){
 const today=parseDateValue(todayISO());
 return state.vehicles.filter(v=>{
  if(dateKey(day)===dateKey(today)&&inYard(v))return true;
  const cycles=v.cycles||[];
  if(!cycles.length)return false;
  return cycles.some(c=>{
   const start=parseDateValue(c.entryDate||c.dateIn),finish=parseDateValue(c.exitDate||c.dateOut);
   return !!start&&start<=day&&(!finish||finish>day);
  });
 });
}
function getReportRange(){
 const mode=document.getElementById('reportPeriodMode')?.value||'week';
 let from,to,label;
 if(mode==='day'){
  from=parseDateValue(document.getElementById('reportDay').value);to=from;
  label='Ngày · '+dateLabel(from);
 }else if(mode==='month'){
  const val=document.getElementById('reportMonth').value||todayISO().slice(0,7),parts=val.split('-').map(Number);
  from=new Date(parts[0],parts[1]-1,1);to=new Date(parts[0],parts[1],0);
  label='Tháng · '+String(parts[1]).padStart(2,'0')+'/'+parts[0];
 }else{
  from=parseDateValue(document.getElementById('reportFrom').value);to=parseDateValue(document.getElementById('reportTo').value);
  if(from>to){const t=from;from=to;to=t}
  label='Tuần · '+dateLabel(from)+' – '+dateLabel(to);
 }
 return {mode,from,to,label};
}
function reportPeriodDates(range){
 const total=Math.max(1,Math.round((range.to-range.from)/86400000)+1),count=range.mode==='day'?1:7,dates=[];
 for(let i=0;i<count;i++){
  const offset=count===1?0:Math.round(i*(total-1)/(count-1));
  const d=new Date(range.from);d.setDate(d.getDate()+offset);dates.push(d);
 }
 return dates;
}
function reportBuildHtml(range,special){
 const end=range.to,live=reportSnapshot(end),old=live.filter(v=>vehicleTypeOf(v)==='Xe cũ').length,nw=live.length-old;
 const age=live.map(v=>({v,days:reportAgeDays(reportAgeDate(v),end)}));
 const groups=[age.filter(x=>x.days!==null&&x.days<=10),age.filter(x=>x.days!==null&&x.days>=11&&x.days<=20),age.filter(x=>x.days!==null&&x.days>=21&&x.days<=31),age.filter(x=>x.days===null||x.days>31)];
 const fromTime=range.from.getTime(),toTime=range.to.getTime()+86400000-1;
 const cycleIn=c=>{const d=parseDateValue(c.entryDate||c.dateIn);return d&&d.getTime()>=fromTime&&d.getTime()<=toTime};
 const cycleOut=c=>{const d=parseDateValue(c.exitDate||c.dateOut);return d&&d.getTime()>=fromTime&&d.getTime()<=toTime};
 const entries=state.vehicles.reduce((n,v)=>n+(v.cycles||[]).filter(cycleIn).length,0);
 const exits=state.vehicles.reduce((n,v)=>n+(v.cycles||[]).filter(cycleOut).length,0);
 const newExited=state.vehicles.reduce((n,v)=>n+(vehicleTypeOf(v)!=='Xe cũ'?(v.cycles||[]).filter(cycleOut).length:0),0);
 const dates=reportPeriodDates(range),snaps=dates.map(d=>({date:d,vehicles:reportSnapshot(d)}));
 const maxOld=Math.max(1,...snaps.map(x=>x.vehicles.filter(v=>vehicleTypeOf(v)==='Xe cũ').length));
 const maxNew=Math.max(1,...snaps.map(x=>x.vehicles.filter(v=>vehicleTypeOf(v)!=='Xe cũ').length));
 const trend=snaps.map(x=>{
  const a=x.vehicles.filter(v=>vehicleTypeOf(v)==='Xe cũ').length,b=x.vehicles.length-a;
  const label=range.mode==='month'?String(x.date.getDate()):String(x.date.getDate());
  return `<div class="trend-day"><div class="trend-bars"><div class="trend-bar old" style="height:${Math.max(2,a/maxOld*125)}px"><span class="trend-val">${a}</span></div><div class="trend-bar new" style="height:${Math.max(2,b/maxNew*125)}px"><span class="trend-val">${b}</span></div></div><small>${label}</small></div>`;
 }).join('');
 const maxAge=Math.max(1,...groups.map(g=>g.length));
 const ageRows=[['0–10 ngày',groups[0].length,'#e9ad18'],['11–20 ngày',groups[1].length,'#e9ad18'],['21–31 ngày',groups[2].length,'#f5822b'],['>31 ngày (kể cả thiếu ngày nhập)',groups[3].length,'#e33c49']].map(([label,count,color])=>`<div class="age-row"><span>${label}</span><div class="age-track"><div class="age-fill" style="width:${count/maxAge*100}%;background:${color}"></div></div><b>${count}</b></div>`).join('');
 const specialBlock=special.trim()?`<div class="reportbox report-special"><h2>DIỄN BIẾN ĐẶC BIỆT</h2><div class="special-content">${esc(special).replace(/\n/g,'<br>')}</div></div>`:'';
 const missing=groups[3].filter(x=>x.days===null).length;
 return `<div class="report" id="reportCanvas"><div class="report-banner"><h1>BÁO CÁO TỔNG QUAN BÃI XE</h1><p>${esc(range.label)}</p></div><div class="reportcards"><div class="reportcard"><span>TỔNG XE TỒN BÃI</span><strong>${live.length}</strong></div><div class="reportcard"><span>XE CŨ CÓ BIỂN</span><strong>${old}</strong></div><div class="reportcard"><span>XE MỚI CHƯA BIỂN</span><strong>${nw}</strong></div><div class="reportcard"><span>XE TỒN TỪ 11 NGÀY</span><strong>${age.filter(x=>x.days===null||x.days>=11).length}</strong></div></div><div class="report-mid"><div class="reportbox"><h2>DIỄN BIẾN XE TỒN BÃI TRONG KỲ</h2><div class="report-sub">Số xe còn tại bãi cuối mỗi mốc ngày - So sánh xe cũ và xe mới</div><div class="trend-chart">${trend}</div><div class="trend-legend"><i style="background:#1684c9"></i>Xe cũ　 <i style="background:#16a56d"></i>Xe mới</div></div><div class="reportbox"><h2>CHỈ TIÊU TRONG KỲ</h2><div class="report-metrics"><div class="metric-row"><span>Lượt xe vào</span><b>${entries}</b></div><div class="metric-row"><span>Lượt xe ra</span><b>${exits}</b></div><div class="metric-row"><span>Xe mới xuất bãi</span><b>${newExited}</b></div></div></div></div><div class="reportbox report-age"><h2>CẢNH BÁO XE TỒN BÃI THEO THỜI GIAN NHẬP</h2><div class="report-sub">Nhóm 0–10 ngày: ${groups[0].length} xe</div>${ageRows}</div>${specialBlock}<div class="report-foot">Mốc tồn đã kiểm: ${dateLabel(end)} (${live.length} xe đang ở bãi). Hồ sơ thiếu ngày vào: ${missing}; số liệu ngày nhập lấy từ dữ liệu hồ sơ / file Excel / JSON; hồ sơ thiếu ngày nhập được xếp vào nhóm trên 31 ngày.</div></div>`;
}
function refreshReportPreview(){
 const range=getReportRange(),special=document.getElementById('reportSpecialInput').value||'';
 const preview=document.getElementById('reportPreviewContent');
 preview.innerHTML=reportBuildHtml(range,special);
}
function exportCurrentReport(){
 const range=getReportRange(),special=document.getElementById('reportSpecialInput').value||'';
 const host=document.getElementById('reportHost');host.className='';host.innerHTML=reportBuildHtml(range,special);
 const report=host.querySelector('#reportCanvas');
 requestAnimationFrame(()=>requestAnimationFrame(async()=>{
  try{
   const canvas=await html2canvas(report,{scale:3,useCORS:true,backgroundColor:'#ffffff',width:1400,height:report.scrollHeight,windowWidth:1400,scrollX:0,scrollY:0,logging:false});
   const url=canvas.toDataURL('image/png');
   openModal(`<h3>Xem trước ảnh báo cáo PNG</h3><div style="max-height:65dvh;overflow:auto;border:1px solid #dbe5ef;border-radius:10px"><img src="${url}" style="display:block;width:100%;height:auto"></div><div class="actions"><button class="btn primary" id="downloadPng">Tải ảnh PNG</button><button class="btn gray" onclick="openReportPreview()">Quay lại chỉnh báo cáo</button></div>`,true);
   document.getElementById('downloadPng').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='BAI_XE_34_BAO_CAO_'+dateKey(range.to)+'.png';a.click()};
  }catch(e){showToast('Không tạo được ảnh: '+e.message,'error')}

 }));
}
function openReportPreview(){
 const now=todayISO(),d=parseDateValue(now),weekday=d.getDay(),monday=new Date(d);monday.setDate(d.getDate()-(weekday===0?6:weekday-1));const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
 openModal(`<h3>Thiết lập & xem trước báo cáo</h3><div class="formgrid"><div class="field"><label>Kỳ báo cáo</label><select id="reportPeriodMode"><option value="day">Báo cáo ngày</option><option value="week" selected>Báo cáo tuần</option><option value="month">Báo cáo tháng</option></select></div><div class="field" id="reportDayWrap"><label>Chọn ngày</label><input type="date" id="reportDay" value="${now}"></div><div class="field" id="reportFromWrap"><label>Từ ngày</label><input type="date" id="reportFrom" value="${dateKey(monday)}"></div><div class="field" id="reportToWrap"><label>Đến ngày</label><input type="date" id="reportTo" value="${dateKey(sunday)}"></div><div class="field full hidden" id="reportMonthWrap"><label>Chọn tháng / năm</label><input type="month" id="reportMonth" value="${now.slice(0,7)}"></div><div class="field full"><label>Diễn biến đặc biệt (không bắt buộc)</label><textarea id="reportSpecialInput" placeholder="Ví dụ: Xe bàn giao gấp, xe chờ phụ tùng, điều chuyển lô lớn..." rows="3"></textarea></div></div><div class="actions"><button class="btn primary" id="createReportPng">Xuất ảnh PNG độ nét cao</button><button class="btn gray" onclick="closeModal()">Đóng</button></div><div class="report-preview-title">XEM TRƯỚC BỐ CỤC BÁO CÁO</div><div class="report-preview-window" id="reportPreviewContent"></div>` ,true);
 const mode=document.getElementById('reportPeriodMode');
 const updateMode=()=>{const m=mode.value;document.getElementById('reportDayWrap').classList.toggle('hidden',m!=='day');document.getElementById('reportFromWrap').classList.toggle('hidden',m!=='week');document.getElementById('reportToWrap').classList.toggle('hidden',m!=='week');document.getElementById('reportMonthWrap').classList.toggle('hidden',m!=='month');refreshReportPreview()};
 mode.addEventListener('change',updateMode);
 ['reportDay','reportFrom','reportTo','reportMonth','reportSpecialInput'].forEach(id=>document.getElementById(id).addEventListener('input',refreshReportPreview));
 document.getElementById('createReportPng').onclick=exportCurrentReport;
 updateMode();
}
document.getElementById('reportBtn').onclick=openReportPreview;
render();
if(localStorage.getItem(URL_KEY)){setSync('busy','Đang tải dữ liệu trung tâm');initializeSync().then(startSheetPolling);}
</script>
