plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.qlbx.erp'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.qlbx.erp'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
