name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/android-apk.yml"
      - "assets/vinfast-logo.svg"

permissions:
  contents: read

concurrency:
  group: bai-xe-34-android-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build Bãi Xe 34 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify source and prepare web assets
        run: |
          set -euo pipefail
          test -s index.html
          grep -Fq 'src="./html2canvas.min.js"' index.html
          mkdir -p www
          cp index.html www/index.html

      - name: Create Capacitor Android project and native file export bridge
        run: |
          set -euo pipefail
          npm init -y
          npm install --save-exact @capacitor/core@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 html2canvas@1.4.1
          npm install --save-dev --save-exact @capacitor/cli@7
          cp node_modules/html2canvas/dist/html2canvas.min.js www/html2canvas.min.js
          npx cap init "Bãi Xe 34" "vn.qlbx.erp" --web-dir www
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          import re
          main_files = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(main_files) != 1:
              raise SystemExit(f"Expected exactly one MainActivity.java, found {len(main_files)}")
          main = main_files[0]
          src = main.read_text(encoding="utf-8")
          m = re.search(r"^package\s+([\w.]+);", src, re.M)
          if not m:
              raise SystemExit("Could not determine MainActivity package")
          package = m.group(1)
          plugin = main.parent / "FileExportPlugin.java"
          plugin.write_text("""package PACKAGE_NAME;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.util.Base64;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;
          @CapacitorPlugin(name = "FileExport")
          public class FileExportPlugin extends Plugin {
              @PluginMethod
              public void saveFile(PluginCall call) {
                  String filename = call.getString("filename");
                  String mimeType = call.getString("mimeType");
                  String encoded = call.getString("data");
                  if (filename == null || filename.trim().isEmpty() || encoded == null || encoded.isEmpty()) {
                      call.reject("Thiếu tên file hoặc dữ liệu file."); return;
                  }
                  if (mimeType == null || mimeType.isEmpty()) mimeType = "application/octet-stream";
                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType(mimeType);
                  intent.putExtra(Intent.EXTRA_TITLE, filename);
                  startActivityForResult(call, intent, "saveFileResult");
              }
              @ActivityCallback
              private void saveFileResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null || result.getData().getData() == null) {
                      call.reject("Bạn đã hủy thao tác lưu file."); return;
                  }
                  Uri uri = result.getData().getData();
                  try {
                      byte[] bytes = Base64.decode(call.getString("data"), Base64.DEFAULT);
                      OutputStream output = getContext().getContentResolver().openOutputStream(uri, "w");
                      if (output == null) throw new IllegalStateException("Không mở được vị trí lưu file.");
                      try (OutputStream stream = output) { stream.write(bytes); stream.flush(); }
                      JSObject ret = new JSObject();
                      ret.put("uri", uri.toString());
                      ret.put("bytes", bytes.length);
                      call.resolve(ret);
                  } catch (Exception e) { call.reject("Không thể ghi file: " + e.getMessage(), e); }
              }
          }
          """.replace("PACKAGE_NAME", package), encoding="utf-8")
          main.write_text("""package PACKAGE_NAME;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(FileExportPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          """.replace("PACKAGE_NAME", package), encoding="utf-8")
          PY

      - name: Apply Android status bar, keyboard, and VINFAST launcher icon
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import re, glob
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text(encoding="utf-8")
          if "android:windowSoftInputMode=" not in xml:
              xml, n = re.subn(r"<activity\b([^>]*)>", lambda m: '<activity' + m.group(1) + ' android:windowSoftInputMode="adjustResize">', xml, count=1)
              if n != 1: raise SystemExit("Could not locate Android activity")
          xml = re.sub(r'android:label="[^"]*"', 'android:label="Bãi Xe 34"', xml, count=1)
          manifest.write_text(xml, encoding="utf-8")
          gradle = Path("android/variables.gradle")
          gs = gradle.read_text(encoding="utf-8")
          gs, n = re.subn(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 34", gs, count=1)
          if n != 1: raise SystemExit("Could not set targetSdkVersion=34")
          gradle.write_text(gs, encoding="utf-8")
          for name in glob.glob("android/app/src/main/res/values*/styles.xml") + glob.glob("android/app/src/main/res/values*/themes.xml"):
              p = Path(name); src = p.read_text(encoding="utf-8")
              pat = r'(<style\s+name="AppTheme(?:\.[^"]*)?"[^>]*>)(.*?)(</style>)'
              def patch(m):
                  body = m.group(2)
                  for key in ("android:windowFullscreen", "android:statusBarColor", "android:windowLightStatusBar", "android:windowDrawsSystemBarBackgrounds"):
                      body = re.sub(r'<item\s+name="' + re.escape(key) + r'">.*?</item>', '', body, flags=re.S)
                  body += '\n<item name="android:windowFullscreen">false</item>\n<item name="android:statusBarColor">#FFFFFF</item>\n<item name="android:windowLightStatusBar">true</item>\n<item name="android:windowDrawsSystemBarBackgrounds">true</item>\n'
                  return m.group(1) + body + m.group(3)
              out, n = re.subn(pat, patch, src, count=1, flags=re.S)
              if n: p.write_text(out, encoding="utf-8")
          # VINFAST-inspired V emblem. The editable vector master is kept in assets/.
          root = Path("android/app/src/main/res")
          def draw_icon(size, adaptive=False):
              im = Image.new("RGBA", (size, size), (0,0,0,0) if adaptive else (8,67,150,255))
              d = ImageDraw.Draw(im)
              if not adaptive:
                  for y in range(size):
                      t = y/max(1,size-1)
                      c = (int(8+13*t), int(67+52*t), int(150+58*t), 255)
                      d.line((0,y,size,y), fill=c)
              s=size
              # Stylized chrome-white V with outward wings.
              pts=[(int(.13*s),.28*s),(int(.24*s),.22*s),(.5*s,.60*s),(.76*s,.22*s),(.87*s,.28*s),(.5*s,.82*s)]
              pts=[(int(x),int(y)) for x,y in pts]
              d.polygon(pts, fill=(255,255,255,255))
              # Blue inner cutout makes the emblem read as a clean V.
              cut=[(.34*s,.34*s),(.5*s,.58*s),(.66*s,.34*s),(.59*s,.31*s),(.5*s,.46*s),(.41*s,.31*s)]
              cut=[(int(x),int(y)) for x,y in cut]
              d.polygon(cut, fill=(15,91,183,255) if not adaptive else (0,0,0,0))
              return im
          for density, size in (("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)):
              folder=root/f"mipmap-{density}"; folder.mkdir(parents=True,exist_ok=True)
              draw_icon(size).save(folder/"ic_launcher.png")
              draw_icon(size).save(folder/"ic_launcher_round.png")
              draw_icon(size,True).save(folder/"ic_launcher_foreground.png")
          anydpi=root/"mipmap-anydpi-v26"; anydpi.mkdir(parents=True,exist_ok=True)
          (anydpi/"ic_launcher.xml").write_text('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>''',encoding="utf-8")
          (anydpi/"ic_launcher_round.xml").write_text('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>''',encoding="utf-8")
          values=root/"values"; values.mkdir(parents=True,exist_ok=True)
          (values/"ic_launcher_background.xml").write_text('''<resources><color name="ic_launcher_background">#1557A6</color></resources>''',encoding="utf-8")
          PY

      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK and upload artifact
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: BaiXe34-VINFAST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
