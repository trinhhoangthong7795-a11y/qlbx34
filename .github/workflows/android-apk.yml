name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: bai-xe-34-android-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build Bãi Xe 34 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify source HTML
        run: |
          test -s index.html
          mkdir -p www
          cp index.html www/index.html

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm install --save-exact @capacitor/core@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 html2canvas@1.4.1
          npm install --save-dev --save-exact @capacitor/cli@7
          cp node_modules/html2canvas/dist/html2canvas.min.js www/html2canvas.min.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")
          old = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
          if old not in s:
              raise SystemExit("Could not find html2canvas CDN reference in index.html")
          p.write_text(s.replace(old, "./html2canvas.min.js"), encoding="utf-8")
          PY
          npx cap init "Bãi Xe 34" "vn.qlbx.erp" --web-dir www
          npx cap add android
          npx cap sync android

          # Register a native Android save-file plugin backed by ACTION_CREATE_DOCUMENT.
          # This lets the user choose Downloads (or another folder) and persists the file
          # outside the app's temporary cache without broad storage permissions.
          python3 - <<'PY'
          from pathlib import Path
          import re

          main_files = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(main_files) != 1:
              raise SystemExit(f"Expected exactly one MainActivity.java, found {len(main_files)}")
          main = main_files[0]
          src = main.read_text(encoding="utf-8")
          m = re.search(r"^package\s+([\w.]+);", src, re.M)
          if not m:
              raise SystemExit("Could not determine MainActivity package")
          package = m.group(1)
          plugin = main.parent / "FileExportPlugin.java"
          plugin.write_text("""package PACKAGE_NAME;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.util.Base64;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "FileExport")
          public class FileExportPlugin extends Plugin {
              @PluginMethod
              public void saveFile(PluginCall call) {
                  String filename = call.getString("filename");
                  String mimeType = call.getString("mimeType");
                  String encoded = call.getString("data");
                  if (filename == null || filename.trim().isEmpty() || encoded == null || encoded.isEmpty()) {
                      call.reject("Thiếu tên file hoặc dữ liệu file.");
                      return;
                  }
                  if (mimeType == null || mimeType.isEmpty()) mimeType = "application/octet-stream";

                  File stagedFile = null;
                  try {
                      // Stage the payload in app cache before opening the external picker.
                      // Capacitor otherwise persists the full PluginCall JSON in Activity state;
                      // large Base64 exports can exceed Android's Binder/Bundle transaction limit.
                      byte[] bytes = Base64.decode(encoded, Base64.DEFAULT);
                      stagedFile = File.createTempFile("qlbx-export-", ".tmp", getContext().getCacheDir());
                      try (FileOutputStream staged = new FileOutputStream(stagedFile)) {
                          staged.write(bytes);
                          staged.flush();
                      }

                      // Keep only a short cache path in the saved PluginCall while the picker is open.
                      call.getData().remove("data");
                      call.getData().put("tempPath", stagedFile.getAbsolutePath());

                      Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      intent.setType(mimeType);
                      intent.putExtra(Intent.EXTRA_TITLE, filename);
                      startActivityForResult(call, intent, "saveFileResult");
                  } catch (Exception e) {
                      if (stagedFile != null) stagedFile.delete();
                      call.reject("Không thể chuẩn bị file để lưu: " + e.getMessage(), e);
                  }
              }

              @ActivityCallback
              private void saveFileResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  String tempPath = call.getString("tempPath");
                  File stagedFile = tempPath == null ? null : new File(tempPath);
                  if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null || result.getData().getData() == null) {
                      if (stagedFile != null) stagedFile.delete();
                      call.reject("Bạn đã hủy thao tác lưu file.");
                      return;
                  }

                  Uri uri = result.getData().getData();
                  long totalBytes = 0;
                  try {
                      if (stagedFile == null || !stagedFile.isFile()) {
                          throw new IllegalStateException("Không tìm thấy dữ liệu tạm để ghi file.");
                      }
                      OutputStream output = getContext().getContentResolver().openOutputStream(uri, "w");
                      if (output == null) throw new IllegalStateException("Không mở được vị trí lưu file.");
                      try (InputStream input = new FileInputStream(stagedFile);
                           OutputStream stream = output) {
                          byte[] buffer = new byte[64 * 1024];
                          int count;
                          while ((count = input.read(buffer)) != -1) {
                              stream.write(buffer, 0, count);
                              totalBytes += count;
                          }
                          stream.flush();
                      }
                      JSObject ret = new JSObject();
                      ret.put("uri", uri.toString());
                      ret.put("bytes", totalBytes);
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("Không thể ghi file: " + e.getMessage(), e);
                  } finally {
                      if (stagedFile != null) stagedFile.delete();
                  }
              }
          }
          """.replace("PACKAGE_NAME", package), encoding="utf-8")

          main.write_text("""package PACKAGE_NAME;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(FileExportPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          """.replace("PACKAGE_NAME", package), encoding="utf-8")
          PY

      - name: Configure Android app label and keyboard behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text(encoding="utf-8")

          # Keep system bars visible and keep the WebView below the status bar.
          if "android:windowSoftInputMode=" not in xml:
              xml, count = re.subn(
                  r"<activity\b([^>]*)>",
                  lambda m: '<activity' + m.group(1) +
                            ' android:windowSoftInputMode="adjustResize">',
                  xml,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not locate the Android activity in AndroidManifest.xml")
          xml = re.sub(r'android:label="[^"]*"', 'android:label="Bãi Xe 34"', xml, count=1)
          manifest.write_text(xml, encoding="utf-8")

          # API 35 enforces edge-to-edge. This sideloaded APK uses API 34 so Android
          # reserves the notification/status-bar area instead of drawing the app behind it.
          gradle = Path("android/variables.gradle")
          if not gradle.exists():
              raise SystemExit("android/variables.gradle was not generated")
          gs = gradle.read_text(encoding="utf-8")
          gs2, count = re.subn(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 34", gs, count=1)
          if count != 1:
              raise SystemExit("Could not safely set targetSdkVersion to 34")
          gradle.write_text(gs2, encoding="utf-8")

          # Explicitly set a visible light status bar and disable fullscreen.
          import glob
          theme_files = glob.glob("android/app/src/main/res/values*/styles.xml") + glob.glob("android/app/src/main/res/values*/themes.xml")
          patched = 0
          for name in theme_files:
              p = Path(name)
              src = p.read_text(encoding="utf-8")
              pat = r'(<style\s+name="AppTheme(?:\.[^"]*)?"[^>]*>)(.*?)(</style>)'
              def fix(m):
                  body = m.group(2)
                  for key in ("android:windowFullscreen", "android:statusBarColor", "android:windowLightStatusBar", "android:windowDrawsSystemBarBackgrounds"):
                      body = re.sub(r'<item\s+name="' + re.escape(key) + r'">.*?</item>', '', body, flags=re.S)
                  body += ('\n        <item name="android:windowFullscreen">false</item>'
                           '\n        <item name="android:statusBarColor">#FFFFFF</item>'
                           '\n        <item name="android:windowLightStatusBar">true</item>'
                           '\n        <item name="android:windowDrawsSystemBarBackgrounds">true</item>\n    ')
                  return m.group(1) + body + m.group(3)
              out, n = re.subn(pat, fix, src, count=1, flags=re.S)
              if n:
                  p.write_text(out, encoding="utf-8")
                  patched += 1
          if patched < 1:
              raise SystemExit("Could not find an AppTheme style in generated Android resources")
          PY

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaiXe34-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
